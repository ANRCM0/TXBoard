name: internal-admin-consumer

on:
  # Historical migration/prototype evidence; outside the native development gate.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: internal-admin-consumer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: txboard-ci-admin-consumer-root-only
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: txboard_admin_consumer_test
          MYSQL_USER: txboard_admin_consumer
          MYSQL_PASSWORD: txboard-ci-admin-consumer-only
        ports: ['13306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ptxboard-ci-admin-consumer-root-only"
          --health-interval 5s --health-retries 20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '13306'
      DB_DATABASE: txboard_admin_consumer_test
      DB_USERNAME: txboard_admin_consumer
      DB_PASSWORD: txboard-ci-admin-consumer-only
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, bcmath
          coverage: none
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.2'
      - name: Restore locked Core dependencies
        run: composer install --working-dir=api --no-interaction --prefer-dist
      - name: Permit synthetic audit fault trigger
        run: |
          php -r '$db = new PDO("mysql:host=127.0.0.1;port=13306;dbname=txboard_admin_consumer_test", "root", "txboard-ci-admin-consumer-root-only", [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); $db->exec("SET GLOBAL log_bin_trust_function_creators=1");'
      - name: Prepare fixture storage
        run: |
          touch api/.env
          mkdir -p api/storage/framework/{cache/data,sessions,views} api/storage/logs api/bootstrap/cache
      - name: Restore locked Gateway dependencies
        run: npm ci --prefix gateway --no-audit --no-fund
      - name: Gateway typecheck tests and build
        run: npm run check --prefix gateway
      - name: Real Gateway Admin client Core mTLS MySQL verification
        run: bash scripts/tests/internal-admin-consumer/run.sh "$PWD/api"
      - name: Preserve sanitized integration receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internal-admin-consumer-evidence
          path: /tmp/txboard-internal-admin-consumer.*/result.json
          if-no-files-found: warn
          retention-days: 14
