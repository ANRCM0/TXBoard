# Services publish through Docker's json-file log driver, which grows without
# bound unless it is capped. Left at the default, a busy panel eventually fills
# the host disk and then cannot write logs, sessions or backups either.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  database:
    # Pinned to an exact patch release. `mysql:8.4` is a moving tag: an
    # unrelated `docker compose pull` could otherwise upgrade the database under
    # a running panel, and MySQL does not support downgrading a data directory.
    image: mysql:8.4.11
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_DATABASE: ${TXBOARD_DB_DATABASE:-txboard}
      MYSQL_USER: ${TXBOARD_DB_USERNAME:-txboard}
      MYSQL_PASSWORD: ${TXBOARD_DB_PASSWORD:?set TXBOARD_DB_PASSWORD in deploy/.env}
      MYSQL_ROOT_PASSWORD: ${TXBOARD_DB_ROOT_PASSWORD:?set TXBOARD_DB_ROOT_PASSWORD in deploy/.env}
    volumes:
      - database-data:/var/lib/mysql
    healthcheck:
      # `xboard:install` migrates on first boot, so the API must not start
      # against a MySQL that is still initialising its data directory.
      test:
        - CMD
        - mysqladmin
        - ping
        - --host=127.0.0.1
        - --user=root
        - --password=${TXBOARD_DB_ROOT_PASSWORD:?}
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  api:
    # A stable name instead of compose's <project>-api, so the built image is
    # reusable and `docker image prune` cannot collect it out from under the
    # stack. Point TXBOARD_API_IMAGE at a published image to pull instead.
    image: ${TXBOARD_API_IMAGE:-txboard-api:local}
    build:
      context: ../api
      dockerfile: Dockerfile
      args:
        APP_COMMIT: ${APP_COMMIT:-local}
    restart: unless-stopped
    logging: *default-logging
    # Octane needs a moment to drain in-flight requests and for Horizon to stop
    # picking up jobs. The 10s default cuts that short and can abort a job
    # mid-execution on every redeploy.
    stop_grace_period: 30s
    depends_on:
      database:
        condition: service_healthy
    # No `env_file` on purpose. env_file freezes its values into the container
    # environment at create time, so the blank APP_KEY in api/.env.example
    # shadowed the real key afterwards for every `docker compose exec` process
    # (immutable Dotenv will not override a present variable) while PID 1 kept
    # the entrypoint's key. The result was three different keys in play and
    # undecryptable data. The bind-mounted /www/.env below is the single source
    # of truth; only the service-discovery values that genuinely differ inside
    # the network are injected via `environment:`.
    volumes:
      # Persist everything the app writes: storage/app (uploads, backups),
      # storage/framework (sessions, views) and storage/logs. Mounting the
      # parent keeps a single bind mount in step with the documented layout.
      - ../api/storage:/www/storage
      - ../api/plugins:/www/plugins
      # Ship the in-repository integrations into the plugin scan path.
      - ../integrations/AccessAudit:/www/plugins/AccessAudit
      # Same file the entrypoint reads and `xboard:install` rewrites. Without
      # this mount the generated APP_KEY and INSTALLED=true are lost on every
      # container recreate, so the panel reverts to "not installed".
      - ../api/.env:/www/.env
      - api-redis:/data
    environment:
      docker: "true"
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${TXBOARD_DB_DATABASE:-txboard}
      DB_USERNAME: ${TXBOARD_DB_USERNAME:-txboard}
      DB_PASSWORD: ${TXBOARD_DB_PASSWORD:?set TXBOARD_DB_PASSWORD in deploy/.env}
      # The image runs its own Redis bound to a unix socket only (see
      # .docker/supervisor/supervisord.conf: --port 0 --unixsocket
      # /data/redis.sock). Without these the app dials 127.0.0.1:6379, every
      # cache/queue/settings call fails and the panel silently serves defaults.
      # Point TXBOARD_REDIS_HOST/PORT at an external server to opt out.
      REDIS_HOST: ${TXBOARD_REDIS_HOST:-/data/redis.sock}
      REDIS_PORT: ${TXBOARD_REDIS_PORT:-0}
      REDIS_PASSWORD: ${TXBOARD_REDIS_PASSWORD:-null}
      ENABLE_CADDY: "true"
      ENABLE_HORIZON: "true"
      ENABLE_REDIS: "true"
      ENABLE_WS_SERVER: "true"
    healthcheck:
      # Readiness gate for `docker compose up -d --wait`. The image bundles its
      # own Redis, which needs a few seconds to bind its socket; running
      # `xboard:install` before that makes the installer's cache step fail.
      test: ["CMD-SHELL", "redis-cli -s /data/redis.sock ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  web:
    image: ${TXBOARD_WEB_IMAGE:-txboard-web:local}
    build:
      context: ..
      dockerfile: web/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - api
    environment:
      # Must match the panel setting "subscribe_path", otherwise every
      # subscription link silently 404s. Render it from the panel with
      # deploy/sync-gateway.sh instead of editing it by hand.
      SUBSCRIBE_PATH: ${TXBOARD_SUBSCRIBE_PATH:-s}
      # Empty/:80 -> plain HTTP behind an external TLS terminator.
      # A hostname -> Caddy provisions a Let's Encrypt certificate itself.
      TXBOARD_SITE_ADDRESS: ${TXBOARD_SITE_ADDRESS:-:80}
      # Optional raw Caddy TLS directive, e.g. "tls internal" for a private CA.
      TXBOARD_TLS_DIRECTIVE: ${TXBOARD_TLS_DIRECTIVE:-}
    volumes:
      # Certificates and ACME account keys live here. Without these mounts every
      # container recreate would re-request a certificate and could hit Let's
      # Encrypt's duplicate-certificate rate limit.
      - caddy-data:/data
      - caddy-config:/config
    ports:
      # Configurable so the stack can coexist with whatever else already owns
      # these ports on the host. 443 only carries traffic once
      # TXBOARD_SITE_ADDRESS is a hostname; publishing it unconditionally is
      # harmless otherwise.
      - "${TXBOARD_HTTP_PORT:-80}:80"
      - "${TXBOARD_HTTPS_PORT:-443}:443"

  # Periodic backups. The panel's own ENABLE_AUTO_BACKUP_AND_UPDATE only covers
  # the application's internal export; this protects the database, the APP_KEY
  # and the uploads together, which is what a restore actually needs.
  backup:
    image: mysql:8.4.11
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      database:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/usr/local/bin/txboard-backup.sh"]
    environment:
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${TXBOARD_DB_DATABASE:-txboard}
      DB_USERNAME: ${TXBOARD_DB_USERNAME:-txboard}
      DB_PASSWORD: ${TXBOARD_DB_PASSWORD:?set TXBOARD_DB_PASSWORD in deploy/.env}
      BACKUP_DIR: /backups
      BACKUP_SOURCE_DIR: /backup-source/api
      # Seconds between runs (86400 = daily). Set 0 to make the container run
      # once and exit instead of looping.
      BACKUP_INTERVAL: ${TXBOARD_BACKUP_INTERVAL:-86400}
      BACKUP_RETENTION: ${TXBOARD_BACKUP_RETENTION:-7}
    volumes:
      - ./backup.sh:/usr/local/bin/txboard-backup.sh:ro
      # Point TXBOARD_BACKUP_DIR at another disk or an NFS mount: keeping the
      # backups on the same volume as MySQL defeats the purpose.
      - ${TXBOARD_BACKUP_DIR:-./backups}:/backups
      # Read-only view of the api checkout for .env (the APP_KEY) and uploads.
      # Mounting the directory rather than the two paths keeps Docker from
      # silently creating a *directory* where a missing file was expected.
      - ../api:/backup-source/api:ro

volumes:
  database-data:
  api-redis:
  caddy-data:
  caddy-config:
