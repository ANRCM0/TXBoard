name: internal-session-consumer

on:
  push:
    branches: [main]
    paths: ['api/**', 'gateway/**', 'scripts/tests/internal-sessions/**', 'scripts/tests/internal-readonly/**', 'contracts/v2/core-internal-api/**', '.github/workflows/ci-internal-sessions.yml']
  pull_request:
    paths: ['api/**', 'gateway/**', 'scripts/tests/internal-sessions/**', 'scripts/tests/internal-readonly/**', 'contracts/v2/core-internal-api/**', '.github/workflows/ci-internal-sessions.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: internal-session-consumer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: txboard-ci-root-fixture-only
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: txboard_internal_test
          MYSQL_USER: txboard_internal_list
          MYSQL_PASSWORD: txboard-ci-session-fixture-only
        ports: ['13306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ptxboard-ci-root-fixture-only"
          --health-interval 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['16380:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '13306'
      DB_DATABASE: txboard_internal_test
      DB_USERNAME: txboard_internal_list
      DB_PASSWORD: txboard-ci-session-fixture-only
      INTERNAL_EMAIL_REDIS_PORT: '16380'
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, redis, bcmath
          coverage: none
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - name: Restore locked Core and Gateway dependencies
        run: |
          composer install --working-dir=api --no-interaction --prefer-dist
          npm ci --prefix gateway --no-audit --no-fund
      - name: Permit fault-injection triggers in this disposable MySQL service
        run: |
          php -r '$db = new PDO("mysql:host=127.0.0.1;port=13306;dbname=txboard_internal_test", "root", "txboard-ci-root-fixture-only", [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); $db->exec("SET GLOBAL log_bin_trust_function_creators=1");'
      - name: Prepare explicit synthetic source manifest
        run: |
          touch api/.env
          mkdir -p api/storage/framework/{cache/data,sessions,views} api/storage/logs api/bootstrap/cache
          python3 - <<'PY'
          import json,pathlib,subprocess
          path=pathlib.Path('manifest.json')
          assert not path.exists(), 'Do not overwrite a source manifest'
          path.write_text(json.dumps({'base':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()})+'\n')
          PY
      - name: Build current Gateway and SDK
        working-directory: gateway
        run: npm run build
      - name: Real SDK Gateway mTLS Core MySQL Redis session verification
        run: |
          export INTERNAL_EXPECTED_CORE_COMMIT="$(git rev-parse HEAD)"
          bash gateway/tests/integration/run-internal-sessions-linux.sh "$PWD/api"
      - name: Preserve non-secret integration receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internal-session-consumer-evidence
          path: /tmp/txboard-internal-user-gateway.*/result.json
          if-no-files-found: warn
          retention-days: 14
