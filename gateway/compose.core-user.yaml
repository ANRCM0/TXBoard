# docker compose -f compose.yaml -f compose.core-user.yaml config --quiet
# Operator-managed files and Core service grants must exist before enabling.
services:
  gateway:
    environment:
      GATEWAY_CORE_USER_OPERATIONS_ENABLED: ${GATEWAY_CORE_USER_OPERATIONS_ENABLED:-false}
      GATEWAY_CORE_USER_ENABLED: 'true'
      GATEWAY_ORDER_WRITE_ENABLED: ${GATEWAY_ORDER_WRITE_ENABLED:-false}
      GATEWAY_CORE_USER_SERVICE_ID: ${GATEWAY_CORE_USER_SERVICE_ID:?isolated user service id required}
      GATEWAY_CORE_USER_CREDENTIAL: ${GATEWAY_CORE_USER_CREDENTIAL:?isolated user service credential required}
      GATEWAY_CORE_USER_EPOCH: ${GATEWAY_CORE_USER_EPOCH:?isolated user service epoch required}
      GATEWAY_CORE_USER_CA_FILE: /run/core-user/ca.pem
      GATEWAY_CORE_USER_CERT_FILE: /run/core-user/client.pem
      GATEWAY_CORE_USER_KEY_FILE: /run/core-user/client.key
    volumes:
      - type: bind
        source: ${GATEWAY_CORE_USER_TLS_DIR:?operator TLS directory required}
        target: /run/core-user
        read_only: true
