# Keep the historical project name used when compose.yaml lived under deploy/.
# This makes the root-level migration reuse the existing named volumes and lets
# --remove-orphans retire the old api/web containers safely.
name: deploy

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  database:
    image: mysql:8.4.11
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_DATABASE: ${TXBOARD_DB_DATABASE:-txboard}
      MYSQL_USER: ${TXBOARD_DB_USERNAME:-txboard}
      MYSQL_PASSWORD: ${TXBOARD_DB_PASSWORD:?set TXBOARD_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${TXBOARD_DB_ROOT_PASSWORD:?set TXBOARD_DB_ROOT_PASSWORD in .env}
    volumes:
      - database-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - --host=127.0.0.1
        - --user=root
        - --password=${TXBOARD_DB_ROOT_PASSWORD:?}
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  txboard:
    # One application image contains the API, both SPAs, Caddy, Horizon,
    # embedded Redis, WebSocket server and the optional MCP Gateway.
    image: ${TXBOARD_IMAGE:-ghcr.io/ANRCM0/txboard:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_COMMIT: ${APP_COMMIT:-local}
    restart: unless-stopped
    logging: *default-logging
    stop_grace_period: 30s
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./api/storage:/www/storage
      - ./api/plugins:/www/plugins
      - ./api/.env:/www/.env
      - api-redis:/data
      - caddy-data:/caddy-data
      - caddy-config:/caddy-config
    environment:
      docker: "true"
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${TXBOARD_DB_DATABASE:-txboard}
      DB_USERNAME: ${TXBOARD_DB_USERNAME:-txboard}
      DB_PASSWORD: ${TXBOARD_DB_PASSWORD:?set TXBOARD_DB_PASSWORD in .env}
      REDIS_HOST: ${TXBOARD_REDIS_HOST:-/data/redis.sock}
      REDIS_PORT: ${TXBOARD_REDIS_PORT:-0}
      REDIS_PASSWORD: ${TXBOARD_REDIS_PASSWORD:-null}
      SUBSCRIBE_PATH: ${TXBOARD_SUBSCRIBE_PATH:-s}
      TXBOARD_SITE_ADDRESS: ${TXBOARD_SITE_ADDRESS:-:80}
      TXBOARD_TLS_DIRECTIVE: ${TXBOARD_TLS_DIRECTIVE:-}
      ENABLE_CADDY: "true"
      ENABLE_HORIZON: "true"
      ENABLE_REDIS: "true"
      ENABLE_WS_SERVER: "true"
      ENABLE_MCP: "${TXBOARD_ENABLE_MCP:-false}"
      MCP_HOST: 127.0.0.1
      MCP_PORT: 3000
      MCP_ALLOWED_HOSTS: localhost,127.0.0.1
      MCP_ALLOWED_ORIGINS: ${TXBOARD_MCP_ALLOWED_ORIGINS:-}
    ports:
      - "${TXBOARD_HTTP_PORT:-80}:80"
      - "${TXBOARD_HTTPS_PORT:-443}:443"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -s /data/redis.sock ping | grep -q PONG && php /opt/txboard/healthcheck.php"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  # Backward-compatible standalone MCP profile. New deployments should prefer
  # TXBOARD_ENABLE_MCP=true on the main txboard service so /mcp is served through
  # the same Caddy ingress. The compatibility profile reuses the same TXBoard
  # image instead of building a second MCP image.
  txboard-mcp:
    profiles: ["mcp"]
    image: ${TXBOARD_IMAGE:-ghcr.io/ANRCM0/txboard:latest}
    entrypoint: ["node", "/opt/txboard-mcp/dist/index.js"]
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      txboard:
        condition: service_healthy
    environment:
      TXBOARD_BASE_URL: http://txboard
      MCP_HOST: 0.0.0.0
      MCP_PORT: 3000
      MCP_ALLOWED_HOSTS: ${TXBOARD_MCP_ALLOWED_HOSTS:-localhost,127.0.0.1}
      MCP_ALLOWED_ORIGINS: ${TXBOARD_MCP_ALLOWED_ORIGINS:-}
    ports:
      - "127.0.0.1:${TXBOARD_MCP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6

  backup:
    image: mysql:8.4.11
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      database:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/usr/local/bin/txboard-backup.sh"]
    environment:
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${TXBOARD_DB_DATABASE:-txboard}
      DB_USERNAME: ${TXBOARD_DB_USERNAME:-txboard}
      DB_PASSWORD: ${TXBOARD_DB_PASSWORD:?set TXBOARD_DB_PASSWORD in .env}
      BACKUP_DIR: /backups
      BACKUP_SOURCE_DIR: /backup-source/api
      BACKUP_INTERVAL: ${TXBOARD_BACKUP_INTERVAL:-86400}
      BACKUP_RETENTION: ${TXBOARD_BACKUP_RETENTION:-7}
    volumes:
      - ./backup.sh:/usr/local/bin/txboard-backup.sh:ro
      - ${TXBOARD_BACKUP_DIR:-./backups}:/backups
      - ./api:/backup-source/api:ro

volumes:
  database-data:
  api-redis:
  caddy-data:
  caddy-config:
