name: api-ci

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "contracts/module-package/**"
      - "contracts/module-lifecycle/**"
      - "contracts/theme-package/**"
      - ".github/workflows/ci-api.yml"
  pull_request:
    branches: [main]

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CACHE_DRIVER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      SETTING_CACHE_STORE: array
      AGENT_OPS_PAIRING_CACHE_STORE: array
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, sqlite3, pdo_sqlite, redis
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Run Agent Support slice tests
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
        run: php artisan test tests/Feature/Agent/AgentSupportTest.php
      - name: Run tests
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
        run: php artisan test
