name: native-credential-provider

on:
  # Historical migration/prototype evidence; outside the native development gate.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-credential-provider-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-provider-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_DRIVER: array
      SETTING_CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      CORE_INSTALLATION_MODE: legacy
      CORE_INSTALLATION_EPOCH: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, curl, openssl, bcmath
          coverage: none
      - uses: actions/setup-go@v5
        with:
          go-version-file: node/go.mod
          cache-dependency-path: node/go.sum
      - name: Prepare Core
        working-directory: api
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate
      - name: Core Provider codec, transport, domain and authenticated adapters
        working-directory: api
        run: >-
          php artisan test
          tests/Unit/Domains/CredentialProvider
          tests/Feature/Installation/NativeProviderPreparationTest.php
          tests/Feature/Subscription/NativeCredentialProviderTest.php
          tests/Feature/Txapi/TxapiNativeCredentialProviderTest.php
      - name: Provider race, persistence and mTLS boundaries
        working-directory: node
        run: go test -race ./internal/credentialprovider ./cmd/credential-provider
      - name: Real Core to Provider mutual TLS and lost-response recovery
        run: python3 scripts/verify-native-provider-interop.py

  native-provider-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: provider-root-fixture
          MYSQL_DATABASE: txboard_c2_native_test
          MYSQL_USER: provider_test
          MYSQL_PASSWORD: provider-user-fixture
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=provider-root-fixture"
          --health-interval 5s --health-retries 20
    env:
      APP_ENV: testing
      CORE_NATIVE_TEST_MYSQL: '1'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_DATABASE: txboard_c2_native_test
      DB_USERNAME: provider_test
      DB_PASSWORD: provider-user-fixture
      CACHE_DRIVER: array
      SETTING_CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      CORE_INSTALLATION_MODE: legacy
      CORE_INSTALLATION_EPOCH: '1'
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, curl, openssl, bcmath
          coverage: none
      - name: Prepare Core
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
      - name: Native Provider transactions and ownership on MySQL 8.4
        run: >-
          php artisan test
          tests/Feature/Subscription/NativeCredentialProviderTest.php
          tests/Feature/Txapi/TxapiNativeCredentialProviderTest.php
