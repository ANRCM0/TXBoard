name: Images

on:
  # Runtime/build changes on main update the dev image; documentation-only commits do not.
  push:
    branches: [main]
    tags:
      - "v*"
    paths:
      - "node"
      - ".gitmodules"
      - "scripts/check-node-component.py"
      - "api/**"
      - "!api/**/*.md"
      - "web/**"
      - "!web/**/*.md"
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "package-lock.json"
      - "packages/**"
      - "tools/module-host/**"
      - "tsconfig.base.json"
      - "compose.yaml"
      - "backup.sh"
      - "scripts/test-backup.sh"
      - "scripts/test-core-resource-budget.sh"
      - "scripts/test-runtime-supervision.sh"
      - "scripts/ci-release-recovery.sh"
      - "scripts/resolve-image-tags.sh"
      - "scripts/test-image-tags.sh"
      - "scripts/verify-native-image.py"
      - "scripts/test-native-image-budget.py"
      - "contracts/releases/modular-core.v1.json"
      - ".github/workflows/docker-txboard.yml"
  pull_request:
    paths:
      - "node"
      - ".gitmodules"
      - "scripts/check-node-component.py"
      - "api/**"
      - "!api/**/*.md"
      - "web/**"
      - "!web/**/*.md"
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "package-lock.json"
      - "packages/**"
      - "tools/module-host/**"
      - "tsconfig.base.json"
      - "compose.yaml"
      - "backup.sh"
      - "scripts/test-backup.sh"
      - "scripts/test-core-resource-budget.sh"
      - "scripts/test-runtime-supervision.sh"
      - "scripts/ci-release-recovery.sh"
      - "scripts/resolve-image-tags.sh"
      - "scripts/test-image-tags.sh"
      - "scripts/verify-native-image.py"
      - "scripts/test-native-image-budget.py"
      - "contracts/releases/modular-core.v1.json"
      - ".github/workflows/docker-txboard.yml"
  workflow_dispatch:

permissions:
  contents: read

# Branch builds cannot replace stable or preview; different release tags are
# serialized by channel so a slower older tag cannot overwrite the channel.
concurrency:
  group: txboard-image-${{ github.event_name == 'pull_request' && github.ref || (github.ref_type == 'branch' && (github.ref == 'refs/heads/main' && 'dev' || github.ref) || (contains(github.ref_name, '-') && 'preview' || 'stable')) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref_type == 'branch' }}

jobs:
  # Release tags repeat the current Core/web suite on the exact release commit.
  # Development changes use the dedicated API/web workflows instead.
  release-gate:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_DRIVER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      SETTING_CACHE_STORE: array
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, sqlite3, pdo_sqlite, curl, openssl, sodium, redis, bcmath, pcntl, posix
          coverage: none
      - name: Install API dependencies
        working-directory: api
        run: composer install --no-interaction --prefer-dist
      - name: Prepare API test environment
        working-directory: api
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: API regression tests
        working-directory: api
        run: php artisan test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify web typecheck, tests, build and performance budget
        run: npm run verify:web
  release-recovery:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    # Protect stable/preview publishing with a MySQL upgrade+restore check.
    # This is synthetic CI evidence, not an operator's real backup/rollback.
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: release-ci-root
          MYSQL_DATABASE: txboard_release_ci
          MYSQL_USER: txboard_release_ci
          MYSQL_PASSWORD: release-ci-user
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=release-ci-root"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: txboard_release_ci
      DB_USERNAME: txboard_release_ci
      DB_PASSWORD: release-ci-user
      MYSQL_ROOT_PASSWORD: release-ci-root
      TXBOARD_CI_RESTORE: "1"
      CACHE_DRIVER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      SETTING_CACHE_STORE: array
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_mysql, mysqlnd, redis
          coverage: none
      - name: Install API dependencies
        working-directory: api
        run: composer install --no-interaction --prefer-dist
      - name: Prepare isolated test .env
        working-directory: api
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Lint release/backup runner scripts
        run: |
          bash -n scripts/ci-release-recovery.sh
          sh -n backup.sh
      - name: Migrate synthetic existing MySQL data, back up and restore
        run: bash scripts/ci-release-recovery.sh
      - name: Preserve non-secret synthetic restore evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: txboard-release-recovery-synthetic
          path: api/artifacts/release-recovery.json
          if-no-files-found: warn
          retention-days: 14

  verify:
    # Every selected change verifies the actual image; tags add release gates.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Test image tag classification
        run: bash scripts/test-image-tags.sh
      - name: Test ingress budget expiry and anti-splitting assertions
        run: python3 -B scripts/test-native-image-budget.py
      - name: Verify backup integrity and mysqldump failure handling
        run: bash scripts/test-backup.sh backup.sh
      - name: Validate Compose
        env:
          TXBOARD_DB_PASSWORD: test-password
          TXBOARD_DB_ROOT_PASSWORD: test-root-password
        run: docker compose config >/dev/null
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: txboard-ci:pr
          platforms: linux/amd64
          build-args: |
            APP_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=txboard
          cache-to: type=gha,mode=max,scope=txboard
          provenance: false
      - name: Verify Core Redis budget and no-eviction behavior
        run: bash scripts/test-core-resource-budget.sh txboard-ci:pr
      - name: Verify application startup waits for embedded Redis
        run: bash scripts/test-runtime-supervision.sh txboard-ci:pr
      - name: Verify runtime healthcheck is embedded in image
        run: |
          docker run --rm --entrypoint sh txboard-ci:pr -c \
            'test -f /opt/txboard/healthcheck.php'
      - name: Verify retired MCP runtime is absent
        run: |
          docker run --rm --entrypoint sh txboard-ci:pr -c '
            test ! -e /opt/txboard-mcp
            ! command -v node
            ! grep -Fq "[program:mcp]" /etc/supervisor/conf.d/supervisord.conf
          '
      - name: Verify PHP database runtime dependencies
        run: |
          docker run --rm --entrypoint php txboard-ci:pr -r '
            $drivers = PDO::getAvailableDrivers();
            foreach (["mysql", "sqlite"] as $driver) {
                if (!in_array($driver, $drivers, true)) {
                    fwrite(STDERR, "Missing PDO driver: {$driver}\\n");
                    exit(1);
                }
            }
            echo "PDO drivers: ".implode(", ", $drivers)."\\n";
          '
      - name: Verify dedicated Node authorization crypto in the runtime image
        run: |
          docker run --rm --network none --entrypoint php txboard-ci:pr -r '
            if (!extension_loaded("sodium")) { exit(1); }
            $pair = sodium_crypto_sign_seed_keypair(str_repeat("s", SODIUM_CRYPTO_SIGN_SEEDBYTES));
            $body = "tx-node-native-authorization-v1";
            $signature = sodium_crypto_sign_detached($body, sodium_crypto_sign_secretkey($pair));
            if (!sodium_crypto_sign_verify_detached($signature, $body, sodium_crypto_sign_publickey($pair))) { exit(1); }
            echo "Dedicated Ed25519 runtime roundtrip passed\n";
          '
      - name: Report image footprint
        shell: bash
        run: |
          bytes="$(docker image inspect txboard-ci:pr --format '{{.Size}}')"
          mib="$(awk -v b="$bytes" 'BEGIN { printf "%.1f", b / 1024 / 1024 }')"
          echo "TXBoard local image size: ${mib} MiB (${bytes} bytes)"

          docker run --rm --entrypoint sh txboard-ci:pr -c \
            'du -sh /www /www/vendor /srv /usr/local/lib/php/extensions /usr/bin/caddy /usr/bin/redis-server 2>/dev/null || true' \
            | tee /tmp/txboard-footprint.txt

          {
            echo "### TXBoard image footprint"
            echo
            echo "- Local uncompressed image size: **${mib} MiB** (${bytes} bytes)"
            echo
            echo "#### Runtime paths"
            echo '~~~text'
            cat /tmp/txboard-footprint.txt
            echo '~~~'
            echo
            echo "#### Docker layers"
            echo '~~~text'
            docker history txboard-ci:pr --format '{{.Size}}\t{{.CreatedBy}}'
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke-test Octane runtime
        shell: bash
        run: |
          docker run -d --name txboard-smoke \
            -e DB_CONNECTION=sqlite \
            -e DB_DATABASE=/tmp/txboard-smoke.sqlite \
            -e ENABLE_HORIZON=false \
            -e ENABLE_WS_SERVER=false \
            -e ENABLE_SCHEDULER=false \
            txboard-ci:pr
          ok=0
          for i in {1..30}; do
            if docker exec txboard-smoke php /opt/txboard/healthcheck.php; then
              ok=1
              break
            fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            docker logs txboard-smoke
            exit 1
          fi
          scheduler_status=0
          docker exec txboard-smoke supervisorctl -c /etc/supervisor/conf.d/supervisord.conf \
            status scheduler:* >/tmp/scheduler-disabled-status.txt || scheduler_status=$?
          test "$scheduler_status" -eq 3
          grep -q '^scheduler:scheduler_00 *STOPPED' /tmp/scheduler-disabled-status.txt
          # Test the actual Caddy -> Octane HTTP response, not only the PHP
          # process healthcheck. These endpoints intentionally do not use DB.
          docker exec txboard-smoke php -r '
            foreach (["/api/health", "/txapi/health"] as $path) {
                $socket = fsockopen("127.0.0.1", 80, $errno, $errstr, 2);
                if (!$socket) { fwrite(STDERR, "HTTP socket unavailable\n"); exit(1); }
                fwrite($socket, "GET {$path} HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n");
                $response = stream_get_contents($socket);
                fclose($socket);
                if (!preg_match("~^HTTP/1\\.[01] 200 ~", $response) ||
                    !str_contains($response, "\"status\":\"ok\"")) {
                    fwrite(STDERR, "Native TXBoard liveness HTTP failed on {$path}\n");
                    exit(1);
                }
            }
          '
          docker exec txboard-smoke php -r '
            $socket = fsockopen("127.0.0.1", 80, $errno, $errstr, 2);
            fwrite($socket, "GET /mcp HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n");
            $status = fgets($socket);
            fclose($socket);
            if (!is_string($status) || !str_contains($status, " 404 ")) {
                fwrite(STDERR, "Expected retired /mcp to return 404, got: ".($status ?: "<none>")."\n");
                exit(1);
            }
          '
          docker rm -f txboard-smoke
      - name: Check out the exact native Deploy candidate
        uses: actions/checkout@v4
        with:
          repository: ANRCM0/TXBoard-Deploy
          ref: 32c020e9d490c0b5cd5a6dcc96d3fb96f7dfb049
          path: .ci-native-deploy
          persist-credentials: false
      - name: Check out the same exact Deploy candidate for resource and recovery acceptance
        uses: actions/checkout@v4
        with:
          repository: ANRCM0/TXBoard-Deploy
          ref: 32c020e9d490c0b5cd5a6dcc96d3fb96f7dfb049
          path: .ci-p4-native-deploy
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: node/go.mod
          cache-dependency-path: node/go.sum
      - name: Build actual Provider capability peer
        working-directory: node
        run: go build -buildvcs=false -o "$RUNNER_TEMP/native-image-provider" ./cmd/credential-provider
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Build the SDK module acceptance host and install Chromium
        working-directory: .
        run: |
          npm ci --no-audit --no-fund
          npm run build:sdk
          npm run build --workspace @txboard/module-host
          npx playwright install --with-deps chromium
      - name: Native immutable image installation, module update and killed-executor recovery
        run: sudo -E python3 -B scripts/verify-native-image.py --deploy-root "$GITHUB_WORKSPACE/.ci-native-deploy" --provider-binary "$RUNNER_TEMP/native-image-provider"
      - name: P4 paired image resource limits and complete native backup recovery
        run: sudo -E python3 -B scripts/verify-native-image.py --deploy-root "$GITHUB_WORKSPACE/.ci-p4-native-deploy" --provider-binary "$RUNNER_TEMP/native-image-provider" --verify-resource-profile --output artifacts/p4-native-image.json
      - name: Preserve non-secret exact-image native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modular-native-fixed-image-proof
          path: artifacts/modular-native-image.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve non-secret P4 paired image evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p4-native-fixed-image-proof
          path: artifacts/p4-native-image.json
          if-no-files-found: error
          retention-days: 14
  publish:
    # PRs validate but never push. Only a main commit or a vetted semver Git
    # tag may publish; neither can overwrite the other channel.
    if: >-
      ${{ !cancelled() && needs.verify.result == 'success' &&
          ((github.event_name == 'push' && github.ref == 'refs/heads/main' &&
            needs.release-gate.result == 'skipped' && needs.release-recovery.result == 'skipped') ||
           (startsWith(github.ref, 'refs/tags/v') &&
            needs.release-gate.result == 'success' && needs.release-recovery.result == 'success')) }}
    needs: [release-gate, release-recovery, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Resolve dev / preview / stable image tags
        id: channel
        env:
          TXBOARD_IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/txboard-core
          # Keep existing installations on the previous repository working.
          TXBOARD_IMAGE_ALIASES: ghcr.io/${{ github.repository_owner }}/txboard
        run: bash scripts/resolve-image-tags.sh
      - name: Reject release tags not contained in main
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Release Git tags must reference a commit already on main."
            exit 1
          fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=txboard
          cache-to: type=gha,mode=max,scope=txboard
          tags: ${{ steps.channel.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          provenance: false
      - name: Report published channel
        env:
          RELEASE_CHANNEL: ${{ steps.channel.outputs.channel }}
          RELEASE_TAGS: ${{ steps.channel.outputs.tags }}
        shell: bash
        run: |
          {
            echo "### Published TXBoard ${RELEASE_CHANNEL} image"
            echo
            printf '%s\\n' "$RELEASE_TAGS" | sed 's/^/- `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
