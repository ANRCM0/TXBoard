name: txboard-image

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "web/**"
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "package-lock.json"
      - "compose.yaml"
      - "install.sh"
      - "backup.sh"
      - "install.sh"
      - "backup.sh"
      - ".github/workflows/docker-txboard.yml"
  pull_request:
    branches: [main]
    paths:
      - "api/**"
      - "web/**"
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "package-lock.json"
      - "compose.yaml"
      - ".github/workflows/docker-txboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        env:
          TXBOARD_DB_PASSWORD: test-password
          TXBOARD_DB_ROOT_PASSWORD: test-root-password
        run: docker compose config >/dev/null
      - name: Validate image-only installer
        run: |
          bash -n install.sh
          sh -n backup.sh
          TXBOARD_INSTALL_DIR=/tmp/txboard-installer-test \
          TXBOARD_ADMIN_EMAIL=admin@example.com \
          bash install.sh --yes --render-only
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          platforms: linux/amd64
          build-args: |
            APP_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=txboard
          cache-to: type=gha,mode=max,scope=txboard
          provenance: false

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - name: Validate deployment scripts
        run: |
          bash -n install.sh
          sh -n backup.sh
      - uses: docker/setup-buildx-action@v3
      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=$(echo 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=txboard
          cache-to: type=gha,mode=max,scope=txboard
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
