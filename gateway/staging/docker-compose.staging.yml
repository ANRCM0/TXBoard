# TXBoard Gateway 完整 Staging 环境（GW-216）
#
# 与 staging/compose.gateway.yaml 的区别：
#   - compose.gateway.yaml: 轻量 overlay，仅 Gateway，依赖外部已有 Redis/HPKE
#   - docker-compose.staging.yml: 自包含完整 staging 环境，Gateway + Redis + HPKE
#
# 一键启动：
#   cp staging/.env.example .env  # 或导出环境变量
#   docker compose -f staging/docker-compose.staging.yml up -d --build
#
# 一键回滚：
#   docker compose -f staging/docker-compose.staging.yml down
#   # 不要加 -v，不要删除 TXBoard 数据卷
#
# 注意：
#   - Compose 相对路径以本文件目录 staging/ 为基准
#   - gateway 通过 depends_on 等待 Redis 健康检查通过后再启动
#   - HPKE 私钥通过 Docker secrets 注入，不进入镜像层

name: txboard-gateway-staging

services:
  gateway:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ${GATEWAY_IMAGE:-txboard-gateway:staging}
    restart: unless-stopped
    init: true
    environment:
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 8787
      # --- 上游配置 ---
      TXBOARD_UPSTREAM_URL: ${TXBOARD_STAGING_UPSTREAM_URL:?set to TXBoard staging origin, e.g. http://txboard}
      TXBOARD_ALLOW_PRIVATE_HTTP: ${TXBOARD_ALLOW_PRIVATE_HTTP:-true}
      GATEWAY_UPSTREAM_TIMEOUT_MS: ${GATEWAY_UPSTREAM_TIMEOUT_MS:-8000}
      # --- Origin / CORS ---
      GATEWAY_ALLOWED_ORIGINS: ${GATEWAY_STAGING_ALLOWED_ORIGINS:?set exact staging HTTPS origin}
      # --- HPKE（默认关闭） ---
      GATEWAY_HPKE_MODE: ${GATEWAY_HPKE_MODE:-disabled}
      GATEWAY_REDIS_URL: ${GATEWAY_REDIS_URL:-redis://gateway-redis:6379}
      GATEWAY_ACCOUNT_WORKFLOWS_ENABLED: ${GATEWAY_ACCOUNT_WORKFLOWS_ENABLED:-false}
      # --- 观测 ---
      GATEWAY_LOG_LEVEL: ${GATEWAY_LOG_LEVEL:-info}
    secrets:
      - gateway-hpke
    expose:
      - "8787"
    networks:
      - txboard-staging
      - gateway-redis-net
    depends_on:
      gateway-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 5s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid

  gateway-redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - always
      - --maxmemory-policy
      - noeviction
    volumes:
      - gateway-redis-data:/data
    networks:
      - gateway-redis-net
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  # 复用已有 TXBoard staging 私网（Gateway 需要访问 txboard 上游）
  txboard-staging:
    external: true
    name: ${TXBOARD_STAGING_NETWORK:?existing isolated TXBoard staging network required}
  # Gateway ↔ Redis 内部隔离网络
  gateway-redis-net:
    internal: true

volumes:
  gateway-redis-data:

secrets:
  gateway-hpke:
    file: ${GATEWAY_HPKE_SECRET_FILE:-../secrets/gateway-hpke.json}
