name: node-native-traffic-control

# Historical legacy-model control proof; run only when explicitly requested.
on:
  workflow_dispatch:
    inputs:
      full_matrix:
        description: Run the complete retained protocol/kernel matrix
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: node-native-traffic-control-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-traffic-control:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        protocol: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.full_matrix && '["vless","vmess"]' || '["vless"]') }}
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: txboard-ci-native-traffic-root-only
          MYSQL_DATABASE: txboard_native_traffic_test
          MYSQL_USER: txboard_native_traffic
          MYSQL_PASSWORD: txboard-ci-native-traffic-only
        ports: ['13306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ptxboard-ci-native-traffic-root-only"
          --health-interval 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['16379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-retries 20
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '13306'
      DB_DATABASE: txboard_native_traffic_test
      DB_USERNAME: txboard_native_traffic
      DB_PASSWORD: txboard-ci-native-traffic-only
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '16379'
      REDIS_DB: '8'
      REDIS_CACHE_DB: '9'
      GOTOOLCHAIN: local
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, pdo_sqlite, bcmath, redis, pcntl, posix
          coverage: none
      - uses: actions/setup-go@v5
        with:
          go-version-file: node/go.mod
          cache-dependency-path: node/go.sum
      - name: Install local fixture prerequisites
        run: sudo apt-get update && sudo apt-get install -y mariadb-client openssl
      - name: Restore locked Core fixtures and Node dependencies
        run: |
          # Keep the lock and package sources fixed. GitHub dist downloads can
          # fail transiently even when the same pinned commit is available.
          for attempt in 1 2 3; do
            if composer install --working-dir=api --no-interaction --prefer-dist; then
              break
            else
              result=$?
              if [ "$attempt" -eq 3 ]; then exit "$result"; fi
              sleep "$((attempt * 5))"
            fi
          done
          cd node
          go mod download
      - name: Prepare disposable Core storage
        run: |
          touch api/.env
          mkdir -p api/storage/framework/{cache/data,sessions,views} api/storage/logs api/bootstrap/cache
      - name: True native traffic, Redis worker, lost ACK recovery, quota and reset
        run: python3 scripts/tests/node-native-traffic/run.py "$PWD/api" "$PWD/node" "$RUNNER_TEMP/native-traffic-evidence" "${{ matrix.protocol }}"
      - name: Preserve sanitized native traffic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-native-traffic-${{ matrix.protocol }}
          path: ${{ runner.temp }}/native-traffic-evidence/result.json
          if-no-files-found: warn
          retention-days: 14

  native-period-session-order:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: txboard-ci-period-root-only
          MYSQL_DATABASE: txboard_native_period_test
          MYSQL_USER: txboard_native_period
          MYSQL_PASSWORD: txboard-ci-period-only
        ports: ['13306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ptxboard-ci-period-root-only"
          --health-interval 5s --health-retries 20
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_DRIVER: array
      SETTING_CACHE_STORE: array
      NATIVE_TRAFFIC_PERIOD_MYSQL: '1'
      NATIVE_TRAFFIC_PERIOD_PORT: '13306'
      NATIVE_TRAFFIC_PERIOD_PASSWORD: txboard-ci-period-only
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, pdo_sqlite, bcmath, redis, pcntl, posix
          coverage: none
      - name: Restore locked Core fixtures
        run: |
          # Keep the lock and package sources fixed. GitHub dist downloads can
          # fail transiently even when the same pinned commit is available.
          for attempt in 1 2 3; do
            if composer install --working-dir=api --no-interaction --prefer-dist; then
              break
            else
              result=$?
              if [ "$attempt" -eq 3 ]; then exit "$result"; fi
              sleep "$((attempt * 5))"
            fi
          done
      - name: Prepare disposable Core storage
        run: |
          touch api/.env
          mkdir -p api/storage/framework/{cache/data,sessions,views} api/storage/logs api/bootstrap/cache
      - name: Real SQL sessions serialize reset and settlement in both lock orders
        # This job owns its disposable DB; no application or Node service uses it.
        run: cd api && php vendor/bin/phpunit --filter 'NativeTrafficPeriodConcurrencyTest|NativeTrafficBatchStatisticsConcurrencyTest'
