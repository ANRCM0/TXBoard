name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      legacy_mysql:
        description: Also run the retained full legacy MySQL regression
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Select checks
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.select.outputs.api }}
      mysql: ${{ steps.select.outputs.mysql }}
      web: ${{ steps.select.outputs.web }}
      browser: ${{ steps.select.outputs.browser }}
      native: ${{ steps.select.outputs.native }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select checks from the complete Git change set
        id: select
        run: python3 scripts/select-ci-jobs.py

  api:
    name: Core API
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CACHE_DRIVER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      SETTING_CACHE_STORE: array
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Verify current Core domain boundaries
        working-directory: .
        run: |
          python3 scripts/generate-core-contracts.py --check
          python3 scripts/check-admin-unification.py
          python3 scripts/check-browser-core-surface.py
          python3 scripts/check-core-boundaries.py
          python3 scripts/check-kernel-v1.py
          python3 scripts/check-node-component.py
          python3 scripts/check-renderer-registry.py
          python3 scripts/check-modular-release.py
          python3 scripts/module-dev.py lock api/bootstrap/module-composition.json api/bootstrap/module-packages.lock.json --application-root api --check
          python3 scripts/module-dev.py lock api/bootstrap/module-composition.proof.json api/bootstrap/module-packages.proof.lock.json --application-root api --check
          python3 -m unittest discover -s scripts/tests -p test_check_core_boundaries.py
          python3 -m unittest discover -s scripts/tests -p test_module_dev.py
          python3 -m unittest discover -s scripts/tests -p test_renderer_dev.py
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, sqlite3, pdo_sqlite, curl, openssl, sodium, redis, bcmath, pcntl, posix, fileinfo
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Audit locked PHP dependencies
        timeout-minutes: 5
        run: |
          mkdir -p artifacts/security
          composer audit --locked --format=json > artifacts/security/composer-audit.json
      - name: Preserve PHP dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-dependency-audit-${{ github.sha }}
          path: api/artifacts/security/composer-audit.json
          if-no-files-found: warn
      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Exercise the real module developer test runner
        working-directory: .
        run: python3 -m unittest discover -s scripts/tests -p test_module_dev_integration.py
      - name: Check PHP syntax
        run: find app config routes database tests plugins-core plugins/DeliveryReceipt plugins/OfferReservation plugins/ModulePortal -name '*.php' -print0 | xargs -0 -n1 php -l > "$RUNNER_TEMP/php-syntax.log"
      - name: Exercise controlled diagnostics before the full development suite
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
        run: php artisan test tests/Feature/Installation/CoreDiagnoseTest.php
      - name: Run current native development suite
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
        run: php artisan test
      - name: Actual durable HTTPS receiver restart after lost notification acknowledgement
        env:
          CORE_MODULE_RECEIVER_CERT: ${{ runner.temp }}/module-receiver.pem
          CORE_MODULE_RECEIVER_KEY: ${{ runner.temp }}/module-receiver.key
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=module-receiver-fixture -addext subjectAltName=IP:127.0.0.1 -keyout "$CORE_MODULE_RECEIVER_KEY" -out "$CORE_MODULE_RECEIVER_CERT" 2>/dev/null
          chmod 600 "$CORE_MODULE_RECEIVER_KEY"
          php artisan test tests/Integration/Modules/NotificationReceiverTest.php
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test native source and route audit tools
        working-directory: .
        run: |
          node --test scripts/tests/check-native-schema-only.test.mjs
          node --test scripts/tests/p0-api-audit.test.mjs
          node --test scripts/tests/native-admin-release-audit.test.mjs
          node --test scripts/tests/export-route-catalog.test.mjs
          node --test scripts/tests/check-external-integration-routes.test.mjs
      - name: Check native subscription consumer syntax
        working-directory: .
        run: node --check scripts/native-subscription-client.mjs
      - name: Verify native source and Admin references
        working-directory: .
        run: |
          node scripts/check-native-schema-only.mjs --check
          node scripts/native-admin-release-audit.mjs --strict --guard-native --output artifacts/release/admin-native-gap.json
      - name: Audit live HTTP routes and external integration contracts
        working-directory: .
        run: |
          php api/artisan route:list --json > "$RUNNER_TEMP/txboard-routes.json"
          node scripts/p0-api-audit.mjs --routes "$RUNNER_TEMP/txboard-routes.json" --output-dir artifacts/p0-audit
          node scripts/export-route-catalog.mjs --routes "$RUNNER_TEMP/txboard-routes.json" --json artifacts/route-catalog/http-routes.json --markdown artifacts/route-catalog/http-routes.md --check
          node scripts/check-external-integration-routes.mjs --routes "$RUNNER_TEMP/txboard-routes.json"
      - name: Preserve non-secret schema and route audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: txboard-api-contract-audit
          path: |
            artifacts/release/admin-native-gap.json
            artifacts/route-catalog/
            artifacts/p0-audit/
          if-no-files-found: warn
          retention-days: 14

  mysql-regression:
    needs: changes
    if: github.event_name == 'workflow_dispatch' && inputs.legacy_mysql
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: phase4-ci-root
          MYSQL_DATABASE: txboard_ci
          MYSQL_USER: txboard_ci
          MYSQL_PASSWORD: phase4-ci-user
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=phase4-ci-root"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: txboard_ci
      DB_USERNAME: txboard_ci
      DB_PASSWORD: phase4-ci-user
      CACHE_DRIVER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      SETTING_CACHE_STORE: array
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_mysql, mysqlnd, redis
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Apply all production-schema migrations on MySQL 8.4
        run: |
          php artisan migrate --force --no-interaction
          php artisan migrate:status --no-interaction
      - name: Verify native ledger, order and plugin schema exists
        run: |
          php -r '
            require "vendor/autoload.php";
            $app = require "bootstrap/app.php";
            $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            foreach (["tx_user", "tx_order", "tx_traffic_batch", "tx_plugins"] as $table) {
                if (!Illuminate\Support\Facades\Schema::hasTable($table)) {
                    fwrite(STDERR, "Missing MySQL table: " . $table . PHP_EOL);
                    exit(1);
                }
            }
            echo "MySQL core schema verified" . PHP_EOL;
          '
      - name: Verify P0 metadata normalization
        run: php artisan test tests/Unit/Support/Audit/MySqlSchemaInventoryTest.php
      - name: Capture read-only MySQL schema and uniqueness evidence
        run: php scripts/p0-schema-inventory.php --output=artifacts/p0-schema.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify native-only source references
        working-directory: .
        run: node scripts/check-native-schema-only.mjs --check
      - name: Test native-only source guard
        working-directory: .
        run: node --test scripts/tests/check-native-schema-only.test.mjs
      - name: Test native critical snapshot comparison
        working-directory: .
        run: |
          node --test scripts/tests/compare-critical-data-snapshots.test.mjs
          node --test scripts/tests/compare-critical-row-fingerprints.test.mjs
      - name: Capture native critical data baseline
        run: php scripts/database-critical-data-snapshot.php --output=artifacts/critical-data-baseline.json
      - name: Capture native row-level fingerprints
        run: php scripts/database-critical-row-fingerprints.php --output=artifacts/critical-row-fingerprints.json
      - name: Upload native database evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: txboard-native-database-evidence
          path: |
            api/artifacts/critical-data-baseline.json
            api/artifacts/critical-row-fingerprints.json
            api/artifacts/p0-schema.json
          if-no-files-found: warn
          retention-days: 14
      - name: P0-B synthetic MySQL HTTP-to-worker journey
        run: php artisan test tests/Feature/Journey/CorePurchaseTrafficJourneyTest.php
      - name: P0-B synthetic MySQL read-path baseline
        env:
          P0_BASELINE_OUTPUT: ${{ github.workspace }}/api/artifacts/p0b-read-path-mysql.json
        run: php artisan test tests/Feature/Performance/P0ReadPathBaselineTest.php
      - name: Preserve P0-B synthetic benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: txboard-p0b-synthetic-mysql-read-path
          path: api/artifacts/p0b-read-path-mysql.json
          if-no-files-found: warn
          retention-days: 14
      - name: P2-E native user auth and token lifecycle on MySQL
        run: php artisan test tests/Feature/Txapi/TxapiNativeAuthTest.php
      - name: P2-D native support ticket contract on MySQL
        run: php artisan test tests/Feature/Txapi/TxapiTicketWorkflowTest.php
      - name: P2-C native account content contracts on MySQL
        run: php artisan test tests/Feature/Txapi/TxapiAccountContentTest.php
      - name: P2-A native plan catalog and renewal permissions on MySQL
        run: php artisan test tests/Feature/Txapi/TxapiPlanCatalogTest.php
      - name: P1-A native TXAPI read/auth contract on MySQL
        run: php artisan test tests/Feature/Txapi/TxapiCoreContractTest.php
      - name: P3 financial invariant audit regression
        run: php artisan test tests/Feature/Billing/FinancialInvariantAuditTest.php
      - name: Capture P3 read-only billing invariant artifact
        run: php scripts/p3-billing-audit.php --output=artifacts/p3-billing-audit.json
      - name: Upload P3 billing invariant artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: txboard-p3-billing-invariants
          path: api/artifacts/p3-billing-audit.json
          if-no-files-found: warn
          retention-days: 14
      - name: P3-A3 shared checkout and native checkout boundary on MySQL
        run: php artisan test tests/Feature/Txapi/TxapiCheckoutTest.php
      - name: P3-B dual-webhook signed notification and replay on MySQL
        run: php artisan test tests/Feature/Payment/PaymentWebhookTest.php
      - name: P3-A2 native billing contracts and reconciliation
        run: php artisan test tests/Feature/Txapi/TxapiBillingTest.php
      - name: GW-303 idempotency contract and crash recovery on MySQL
        run: php artisan test tests/Feature/Txapi/TxapiOrderIdempotencyTest.php
      - name: C1 purchased terms validation and fulfillment on MySQL
        run: >-
          php artisan test
          tests/Unit/Domains/Billing/OrderPurchaseTermsSnapshotTest.php
          tests/Unit/Domains/Billing/PurchasedOrderGrantTest.php
          tests/Feature/Billing/PurchasedTermsFulfillmentTest.php
      - name: GW-303 real MySQL 100-concurrent-request idempotency stress
        run: php artisan test tests/Feature/Billing/OrderIdempotencyMysqlConcurrencyTest.php
      - name: C2 installation admission and native catalog preparation on MySQL
        run: php artisan test tests/Feature/Installation/InstallationRuntimeTest.php
      - name: P3-A monetary state transitions and coupon recovery on MySQL
        run: php artisan test tests/Unit/Services/OrderServiceConcurrencyTest.php
      - name: P4-D native WS frames, scopes and cross-transport ledger
        run: php artisan test tests/Feature/Server/TxNodeNativeWebSocketTest.php
      - name: P4 native node authentication and protocol contract on MySQL
        run: php artisan test tests/Feature/Server/TxNodeNativeProtocolTest.php
      - name: P4 optimized traffic batch query budget and settlement correctness
        run: php artisan test tests/Feature/Server/TrafficBatchSettlementTest.php
      - name: MySQL order recovery regression
        run: php artisan test tests/Feature/Order/CheckOrderRecoveryTest.php

  installation-bootstrap:
    needs: changes
    if: needs.changes.outputs.mysql == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: c2-bootstrap-root-fixture
          MYSQL_DATABASE: txboard_c2_bootstrap_test
          MYSQL_USER: c2_bootstrap
          MYSQL_PASSWORD: c2-bootstrap-user-fixture
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=c2-bootstrap-root-fixture"
          --health-interval 5s --health-retries 20
    env:
      APP_ENV: testing
      CORE_INSTALLATION_TEST_MYSQL: '1'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: txboard_c2_bootstrap_test
      DB_USERNAME: c2_bootstrap
      DB_PASSWORD: c2-bootstrap-user-fixture
      CACHE_DRIVER: array
      SETTING_CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, pdo_sqlite, curl, openssl, sodium, redis, bcmath, pcntl, posix
          coverage: none
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Prepare disposable fixture
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Concurrent native bootstrap on an empty MySQL 8.4 database
        run: php artisan test tests/Feature/Installation/InstallationBootstrapMysqlTest.php

  native-admin-management:
    needs: changes
    if: needs.changes.outputs.mysql == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: c2-admin-root-fixture
          MYSQL_DATABASE: txboard_c2_native_test_admin
          MYSQL_USER: c2_admin
          MYSQL_PASSWORD: c2-admin-user-fixture
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=c2-admin-root-fixture"
          --health-interval 5s --health-retries 20
    env:
      APP_ENV: testing
      CORE_NATIVE_TEST_MYSQL: '1'
      CORE_INSTALLATION_MODE: legacy
      CORE_INSTALLATION_EPOCH: '1'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: txboard_c2_native_test_admin
      DB_USERNAME: c2_admin
      DB_PASSWORD: c2-admin-user-fixture
      CACHE_DRIVER: array
      SETTING_CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, pdo_sqlite, curl, openssl, sodium, redis, bcmath, pcntl, posix
          coverage: none
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Prepare disposable fixture
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Native admin contracts and additive notice upgrade on MySQL 8.4
        run: >-
          php artisan test
          tests/Feature/Database/NoticePopupMigrationTest.php
          tests/Feature/Database/NativeBusinessMigrationCycleTest.php
          tests/Feature/Content/NativeContentWorkflowTest.php
          tests/Feature/Support/NativeTicketWorkflowTest.php
          tests/Feature/Support/NativeTicketWorkflowMysqlConcurrencyTest.php
          tests/Feature/Support/NativeTicketAttachmentsTest.php
          tests/Feature/Txapi/TxapiAdminResourceReadsTest.php
          tests/Feature/Txapi/TxapiUnifiedAdminManagementTest.php
          tests/Feature/Txapi/TxapiAdminConfigurationTest.php

  native-billing-domain:
    needs: changes
    if: needs.changes.outputs.mysql == 'true'
    name: native-billing-domain (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - shard: ledger-and-transfers
            test_files: >-
              tests/Feature/Billing/NativeMoneyLedgerTest.php
              tests/Feature/Billing/NativeMoneyLedgerMysqlConcurrencyTest.php
              tests/Feature/Billing/NativeGiftCardWorkflowTest.php
              tests/Feature/Billing/NativeGiftBatchesTest.php
              tests/Feature/Billing/NativeWalletRefundTest.php
              tests/Feature/Billing/NativeWalletRefundMysqlConcurrencyTest.php
              tests/Feature/Txapi/TxapiWalletRechargeTest.php
          - shard: discounts-and-commissions
            test_files: >-
              tests/Feature/Billing/NativeCouponWorkflowTest.php
              tests/Feature/Billing/NativeCommissionWorkflowTest.php
              tests/Feature/Billing/NativeReferralWorkflowTest.php
              tests/Feature/Billing/NativeFinancialWorkflowMysqlConcurrencyTest.php
              tests/Feature/Billing/NativeUpgradeCreditTest.php
              tests/Feature/Billing/NativeUpgradeCreditMysqlConcurrencyTest.php
          - shard: payment-attempts-and-checkout
            test_files: >-
              tests/Feature/Billing/NativePaymentAttemptsTest.php
              tests/Feature/Billing/NativeOrderPaymentQueriesTest.php
              tests/Feature/Billing/NativePaymentConfigurationTest.php
              tests/Feature/Billing/NativeOrderAdministrationTest.php
              tests/Feature/Billing/NativePaymentAttemptsMysqlConcurrencyTest.php
              tests/Feature/Billing/NativeEpayCheckoutTest.php
              tests/Feature/Billing/NativePaymentPluginTest.php
              tests/Feature/Billing/NativeFreeCheckoutTest.php
          - shard: settlement-and-recovery
            test_files: >-
              tests/Feature/Billing/NativePaymentSettlementTest.php
              tests/Feature/Billing/NativePaymentSettlementMysqlConcurrencyTest.php
              tests/Feature/Billing/NativeBillingRecoveryTest.php
              tests/Feature/Billing/OrderFulfillmentBoundaryTest.php
              tests/Feature/Modules/ModuleDeploymentTest.php
              tests/Feature/Modules/ProofExtensionsTest.php
          - shard: administrator-account-adjustments
            test_files: >-
              tests/Feature/Billing/NativeAccountAdjustmentsTest.php
              tests/Feature/Billing/NativeAccountAdjustmentBrowserTest.php
              tests/Feature/Billing/NativeCustomerPoliciesTest.php
              tests/Feature/Billing/NativeCustomerPolicyMysqlConcurrencyTest.php
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: c2-native-root-fixture
          MYSQL_DATABASE: txboard_c2_native_test
          MYSQL_USER: c2_native
          MYSQL_PASSWORD: c2-native-user-fixture
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=c2-native-root-fixture"
          --health-interval 5s --health-retries 20
    env:
      APP_ENV: testing
      CORE_NATIVE_TEST_MYSQL: '1'
      CORE_INSTALLATION_MODE: legacy
      CORE_INSTALLATION_EPOCH: '1'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: txboard_c2_native_test
      DB_USERNAME: c2_native
      DB_PASSWORD: c2-native-user-fixture
      CACHE_DRIVER: array
      SETTING_CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, pdo_sqlite, curl, openssl, sodium, redis, bcmath, pcntl, posix
          coverage: none
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Prepare disposable fixture
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Apply native production schema
        run: php artisan migrate --force --no-interaction
      - name: Native billing ledger and payment evidence on MySQL 8.4
        run: php artisan test ${{ matrix.test_files }}

  native-subscription-domain:
    needs: changes
    if: needs.changes.outputs.mysql == 'true'
    name: native-subscription-domain (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - shard: browser-ingress
            run_usage_concurrency: false
            test_files: >-
              tests/Feature/Txapi/CoreBrowserIngressTest.php
          - shard: orders-and-lifecycle
            run_usage_concurrency: false
            test_files: >-
              tests/Feature/Subscription/PublishedOrderPurchaseTest.php
              tests/Feature/Subscription/NativeOrderEventJournalTest.php
              tests/Feature/Subscription/PublishedOrderMysqlConcurrencyTest.php
              tests/Feature/Subscription/NativeOrderRecoveryTest.php
              tests/Feature/Subscription/NativeSubscriptionLifecycleTest.php
              tests/Feature/Subscription/NativeSubscriptionEntitlementTest.php
              tests/Feature/Subscription/EntitlementQueryBoundaryTest.php
              tests/Feature/Txapi/TxapiNativeSubscriptionOperationsTest.php
              tests/Feature/Txapi/TxapiPublishedOrderAdapterTest.php
          - shard: providers-and-delivery
            run_usage_concurrency: false
            test_files: >-
              tests/Unit/Domains/CredentialProvider/ProviderClientBoundaryTest.php
              tests/Unit/Domains/CredentialProvider/ProviderTransportTest.php
              tests/Feature/Subscription/NativeCredentialProviderTest.php
              tests/Feature/Subscription/NativeProviderNodeAuthorizationTest.php
              tests/Feature/Subscription/NativeSubscriptionDeliveryTest.php
              tests/Feature/Subscription/NativeBrowserDeliveriesTest.php
              tests/Feature/Txapi/TxapiNativeSubscriptionAdapterTest.php
              tests/Feature/Installation/NativeProviderTrustTest.php
              tests/Feature/Subscription/NativeSubscriptionLinksTest.php
          - shard: runtime-and-administration
            run_usage_concurrency: false
            test_files: >-
              tests/Feature/Subscription/NativeRuntimeCommerceTest.php
              tests/Feature/Subscription/NativeIdentityAndCatalogTest.php
              tests/Feature/Installation/NativeRuntimeReadinessTest.php
              tests/Feature/Installation/CoreDiagnoseTest.php
              tests/Feature/Installation/InstallationRuntimeTest.php
          - shard: catalog-publications
            run_usage_concurrency: false
            test_files: >-
              tests/Feature/Subscription/NativePlanAdministrationTest.php
              tests/Feature/Subscription/NativeAdminCatalogTest.php
              tests/Feature/Subscription/NativePlanPublicationMysqlConcurrencyTest.php
              tests/Feature/Txapi/TxapiAdminCatalogTest.php
          - shard: internal-admin-boundaries
            run_usage_concurrency: false
            test_files: >-
              tests/Feature/Txapi/TxapiNativeInternalApiTest.php
              tests/Feature/Txapi/TxapiAdminResourceReadsTest.php
              tests/Feature/Txapi/TxapiUnifiedAdminManagementTest.php
              tests/Feature/Txapi/TxapiAdminAuditTest.php
          - shard: content-and-support
