name: node-native-authorization-control

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'node/internal/**'
      - 'node/go.mod'
      - 'node/go.sum'
      - 'scripts/tests/node-native-authorization/**'
      - 'contracts/node-protocol/native-authorization-lease-v1.md'
      - '.github/workflows/ci-node-native-authorization.yml'
  pull_request:
    paths:
      - 'api/**'
      - 'node/internal/**'
      - 'node/go.mod'
      - 'node/go.sum'
      - 'scripts/tests/node-native-authorization/**'
      - 'contracts/node-protocol/native-authorization-lease-v1.md'
      - '.github/workflows/ci-node-native-authorization.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-native-authorization-control-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-authorization-control:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        kernel: [singbox, xray]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: txboard-ci-native-authorization-root-only
          MYSQL_DATABASE: txboard_native_authorization_test_${{ matrix.kernel }}
          MYSQL_USER: txboard_native_authorization
          MYSQL_PASSWORD: txboard-ci-native-authorization-only
        ports: ['13306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ptxboard-ci-native-authorization-root-only"
          --health-interval 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['16379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-retries 20
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '13306'
      DB_DATABASE: txboard_native_authorization_test_${{ matrix.kernel }}
      DB_USERNAME: txboard_native_authorization
      DB_PASSWORD: txboard-ci-native-authorization-only
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '16379'
      REDIS_DB: '8'
      REDIS_CACHE_DB: '9'
      GOTOOLCHAIN: local
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, pdo_sqlite, bcmath, redis, pcntl, posix, sodium
          coverage: none
      - uses: actions/setup-go@v5
        with:
          go-version-file: node/go.mod
          cache-dependency-path: node/go.sum
      - name: Install local fixture prerequisites
        run: sudo apt-get update && sudo apt-get install -y mariadb-client openssl
      - name: Restore locked Core fixtures and Node dependencies
        run: |
          composer install --working-dir=api --no-interaction --prefer-dist
          cd node
          go mod download
      - name: Prepare disposable Core storage
        run: |
          touch api/.env
          mkdir -p api/storage/framework/{cache/data,sessions,views} api/storage/logs api/bootstrap/cache
      - name: Signed snapshots, target scope and rollback regressions on SQLite memory
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_DRIVER: array
          SETTING_CACHE_STORE: array
          NATIVE_TRAFFIC_RECEIPTS_ENABLED: 'false'
        run: cd api && php vendor/bin/phpunit --filter NativeNodeAuthorizationSnapshotTest
      - name: Durable Node authority and independent expiry regressions
        working-directory: node
        run: |
          go test -race ./internal/authorization -count=1
          go test -race ./internal/config ./internal/txboard -run 'Authorization|Authorized' -count=1
          go test -race ./internal/service -run '^TestSignedAuthorization' -count=1
      - name: Validate transparent observation and exclusive fixture preflight
        run: python3 -B scripts/tests/node-native-authorization/test_runner.py
      - name: True signed Core Machine admission, finite offline expiry and original traffic replay
        run: python3 scripts/tests/node-native-authorization/run.py "$PWD/api" "$PWD/node" "$RUNNER_TEMP/native-authorization-evidence" "${{ matrix.kernel }}"
      - name: Preserve sanitized native authorization result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-native-authorization-${{ matrix.kernel }}
          path: ${{ runner.temp }}/native-authorization-evidence/result.json
          if-no-files-found: warn
          retention-days: 14
