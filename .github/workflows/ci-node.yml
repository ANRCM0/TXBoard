name: node-ci

on:
  push:
    branches: [main]
    tags: ["node-v*"]
    paths:
      - "node/**"
      - "integrations/AccessAudit/**"
      - ".github/workflows/ci-node.yml"
  pull_request:
    branches: [main]
    paths:
      - "node/**"
      - "integrations/AccessAudit/**"
      - ".github/workflows/ci-node.yml"
  workflow_dispatch:
    inputs:
      push_latest:
        description: Update the latest node image tag
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: node/go.mod
          cache-dependency-path: node/go.sum
      - name: Test
        working-directory: node
        run: make test

  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/node-v')
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            target: build-linux
          - arch: arm64
            target: build-linux-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: node/go.mod
          cache-dependency-path: node/go.sum
      - name: Build
        working-directory: node
        env:
          VERSION: ${{ github.ref_name }}
        run: make ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: tx-node-linux-${{ matrix.arch }}
          path: |
            node/tx-node-linux-${{ matrix.arch }}
            node/xboard-node-linux-${{ matrix.arch }}
            node/xbctl-linux-${{ matrix.arch }}

  image:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/node-v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=$(echo 'ghcr.io/${{ github.repository }}-node' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ./node
          file: ./node/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD_TIME=${{ github.event.repository.updated_at }}
          cache-from: type=gha,scope=node
          cache-to: type=gha,mode=max,scope=node
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ startsWith(github.ref, 'refs/tags/node-v') && format('{0}:{1}', steps.image.outputs.name, github.ref_name) || '' }}
            ${{ (startsWith(github.ref, 'refs/tags/node-v') || github.event.inputs.push_latest == 'true') && format('{0}:latest', steps.image.outputs.name) || '' }}

  release:
    if: startsWith(github.ref, 'refs/tags/node-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Package AccessAudit plugin
        shell: bash
        run: |
          cd integrations
          zip -r "$GITHUB_WORKSPACE/dist/AccessAudit-plugin.zip" AccessAudit
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          make_latest: true
          body_path: node/release/NOTES.md
          files: |
            dist/tx-node-linux-amd64
            dist/tx-node-linux-arm64
            dist/xboard-node-linux-amd64
            dist/xboard-node-linux-arm64
            dist/xbctl-linux-amd64
            dist/xbctl-linux-arm64
            dist/AccessAudit-plugin.zip
