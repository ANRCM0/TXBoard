name: Node CI and images

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "node/**"
      - "contracts/node-protocol/**"
      - "contracts/v2/node-usage/**"
      - "scripts/resolve-image-tags.sh"
      - "scripts/test-image-tags.sh"
      - ".github/workflows/ci-node.yml"
  pull_request:
    branches: [main]
    paths:
      - "node/**"
      - "contracts/node-protocol/**"
      - "contracts/v2/node-usage/**"
      - "scripts/resolve-image-tags.sh"
      - "scripts/test-image-tags.sh"
      - ".github/workflows/ci-node.yml"
  workflow_dispatch:

permissions:
  contents: read

# Each main SHA keeps an immutable dev-sha build. Only superseded PR work is cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('node-ci-pr-{0}', github.event.pull_request.number) || format('node-ci-{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash
    working-directory: node

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    name: Classify Node runtime changes
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.classify.outputs.runtime }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep documentation and test-only pushes verification-only
        id: classify
        working-directory: .
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          runtime=false
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            runtime=true
          elif [[ "$GITHUB_EVENT_NAME" == push ]]; then
            if [[ ! "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] \
              || [[ "$BEFORE_SHA" == 0000000000000000000000000000000000000000 ]] \
              || ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
              runtime=true
            else
              changed_files="$(mktemp)"
              git diff --no-renames --name-only -z "$BEFORE_SHA" "$GITHUB_SHA" > "$changed_files"
              while IFS= read -r -d '' file; do
                case "$file" in
                  node/docs/*|node/*.md|node/.github/release/*|node/*_test.go|node/.gitignore) ;;
                  node/*|scripts/resolve-image-tags.sh|.github/workflows/ci-node.yml) runtime=true ;;
                esac
              done < "$changed_files"
              rm -f "$changed_files"
            fi
          fi
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"
          echo "Node runtime publishing selected: $runtime" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Node Go tests and source guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate unified release tag
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: .
        env:
          TXBOARD_IMAGE_REPO: ghcr.io/anrcm0/tx-node
        run: bash scripts/resolve-image-tags.sh
      - uses: actions/setup-go@v5
        with:
          go-version-file: node/go.mod
          cache-dependency-path: node/go.sum
          cache: true
      - name: Verify canonical Go module and source paths
        run: |
          set -euo pipefail
          grep -Fxq 'module github.com/ANRCM0/TX-Node' go.mod
          if grep -RFn 'github.com/PaiMonCai/TX-Node' cmd internal Makefile Dockerfile go.mod; then
            echo "Legacy TX-Node module path has reappeared" >&2
            exit 1
          fi
          if grep -Fq 'ghcr.io/paimoncai/tx-node' Dockerfile; then
            echo "Legacy TX-Node registry location has reappeared" >&2
            exit 1
          fi
          go mod verify
      - name: Enforce ANRCM0-owned pinned kernel dependencies
        run: |
          set -euo pipefail
          grep -Eq '^replace github.com/sagernet/sing-box => github.com/ANRCM0/sing-box v' go.mod
          grep -Eq '^replace github.com/xtls/xray-core => github.com/ANRCM0/Xray-core v' go.mod
          if grep -E 'github.com/PaiMonCai/(sing-box|Xray-core)' go.mod go.sum; then
            echo "Old-account kernel fork dependency has reappeared" >&2
            exit 1
          fi
          grep -Eq '^github.com/ANRCM0/sing-box v[^ ]+ h1:' go.sum
          grep -Eq '^github.com/ANRCM0/Xray-core v[^ ]+ h1:' go.sum
          go mod tidy -diff
      - name: Validate retained historical Node release notes
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .github/release/VERSION)"
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -Fxq "# TX-Node $version" .github/release/NOTES.md
          retired_node_bin="xboard-node""-linux-"
          retired_cli_bin="xbctl""-linux-"
          retired_audit_zip="AccessAudit""-plugin.zip"
          if grep -Fq "$retired_node_bin" .github/release/NOTES.md \
            || grep -Fq "$retired_cli_bin" .github/release/NOTES.md \
            || grep -Fq "$retired_audit_zip" .github/release/NOTES.md; then
            echo "Historical release notes list retired artifacts" >&2
            exit 1
          fi
      - name: Verify release commit is contained in monorepo main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          (git fetch --no-tags --unshallow origin main || git fetch --no-tags origin main)
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tag must refer to a commit on monorepo main" >&2
            exit 1
          }
      - name: Run full Node tests
        run: make test
      - name: Check Go types and diagnostics
        run: go vet ./...
      - name: Enforce legacy retirement boundary
        run: |
          set -euo pipefail
          test ! -d cmd/xbctl
          legacy_xboard_artifact="xboard-node""-linux-"
          legacy_xbctl_artifact="xbctl""-linux-"
          legacy_docker_alias="xboard-node"":latest"
          if grep -Fq "$legacy_xboard_artifact" Makefile ../.github/workflows/ci-node.yml \
            || grep -Fq "$legacy_xbctl_artifact" Makefile ../.github/workflows/ci-node.yml; then
            echo "Retired binary artifacts were reintroduced" >&2
            exit 1
          fi
          if grep -Fq "$legacy_docker_alias" Makefile Dockerfile; then
            echo "Retired Docker alias was reintroduced" >&2
            exit 1
          fi
          grep -Fq 'CMD ["-c", "/etc/txnode/config.yml"]' Dockerfile

  runtime-stability:
    name: Node runtime stability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: node/go.mod
          cache-dependency-path: node/go.sum
          cache: true
      - run: make test-runtime-stability

  image-smoke:
    name: Node image metadata and config compatibility
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image with monorepo metadata
        env:
          BUILD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-sha-{0}', github.sha) }}
        run: |
          set -euo pipefail
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          docker build --build-arg VERSION="$BUILD_VERSION" \
            --build-arg COMMIT="$GITHUB_SHA" --build-arg BUILD_TIME="$build_time" \
            --build-arg SOURCE_URL="https://github.com/$GITHUB_REPOSITORY" \
            -t tx-node:config-path-ci .
          test "$(docker run --rm tx-node:config-path-ci -v)" = "tx-node $BUILD_VERSION (built $build_time)"
          test "$(docker image inspect tx-node:config-path-ci --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          test "$(docker image inspect tx-node:config-path-ci --format '{{ index .Config.Labels "org.opencontainers.image.source" }}')" = "https://github.com/$GITHUB_REPOSITORY"
      - name: Verify canonical image command
        run: |
          set -euo pipefail
          test "$(docker image inspect tx-node:config-path-ci --format '{{json .Config.Cmd}}')" = '["-c","/etc/txnode/config.yml"]'
      - name: Verify old Compose mount fallback
        run: |
          set -euo pipefail
          legacy_cfg="$(mktemp)"
          printf 'invalid: [\n' > "$legacy_cfg"
          output="$(docker run --rm -v "$legacy_cfg:/etc/xboard-node/config.yml:ro" tx-node:config-path-ci 2>&1 || true)"
          printf '%s\n' "$output"
          grep -Fq 'using legacy container config path /etc/xboard-node/config.yml' <<<"$output"
      - name: Verify canonical path wins
        run: |
          set -euo pipefail
          canonical_cfg="$(mktemp)"
          legacy_cfg="$(mktemp)"
          printf 'invalid: [\n' > "$canonical_cfg"
          printf 'invalid: [\n' > "$legacy_cfg"
          output="$(docker run --rm \
            -v "$canonical_cfg:/etc/txnode/config.yml:ro" \
            -v "$legacy_cfg:/etc/xboard-node/config.yml:ro" \
            tx-node:config-path-ci 2>&1 || true)"
          printf '%s\n' "$output"
          if grep -Fq 'using legacy container config path' <<<"$output"; then
            echo "Legacy fallback won despite canonical config being mounted" >&2
            exit 1
          fi

  build:
    name: Node release binaries
    runs-on: ubuntu-latest
    needs: [test, runtime-stability, image-smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: node/go.mod
          cache-dependency-path: node/go.sum
          cache: true
      - name: Build release binary
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          if [[ "$GOARCH" == amd64 ]]; then
            make build-linux
          else
            make build-linux-arm64
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tx-node-linux-${{ matrix.goarch }}
          path: node/tx-node-linux-${{ matrix.goarch }}
          if-no-files-found: error

  publish-image:
    name: Publish independent Node image
    runs-on: ubuntu-latest
    needs: [changes, test, runtime-stability, image-smoke]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.runtime == 'true') || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    # Serialize mutable stable/preview aliases. Main builds retain a distinct
    # group per SHA, so documentation pushes cannot cancel a runtime build.
    concurrency:
      group: node-image-${{ github.ref_type == 'tag' && (contains(github.ref_name, '-') && 'preview' || 'stable') || github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Resolve unified image channel
        id: channel
        working-directory: .
        env:
          TXBOARD_IMAGE_REPO: ghcr.io/anrcm0/tx-node
        run: bash scripts/resolve-image-tags.sh
      - name: Select immutable build tags and metadata
        id: build
        env:
          CHANNEL: ${{ steps.channel.outputs.channel }}
          CHANNEL_TAGS: ${{ steps.channel.outputs.tags }}
        run: |
          set -euo pipefail
          tags="$CHANNEL_TAGS"
          version="$GITHUB_REF_NAME"
          if [[ "$CHANNEL" == dev ]]; then
            tags="$(grep -F ':dev-sha-' <<<"$CHANNEL_TAGS")"
            version="dev-sha-${GITHUB_SHA:0:12}"
          fi
          {
            printf 'tags<<NODE_BUILD_TAGS\n%s\nNODE_BUILD_TAGS\n' "$tags"
            printf 'version=%s\n' "$version"
            printf 'build_time=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build and push Node image
        uses: docker/build-push-action@v5
        with:
          context: node
          file: node/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=txnode
          cache-to: type=gha,mode=max,scope=txnode
          tags: ${{ steps.build.outputs.tags }}
          build-args: |
            VERSION=${{ steps.build.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.build.outputs.build_time }}
            SOURCE_URL=https://github.com/${{ github.repository }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.build.outputs.version }}
      - name: Promote current main image to dev
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "main no longer contains this commit; skip dev promotion"
            exit 0
          }
          # A docs/tests-only commit may advance main while this build runs.
          # It must not cancel publication of the unchanged Node runtime.
          runtime_advanced=false
          changed_files="$(mktemp)"
          git diff --no-renames --name-only -z "$GITHUB_SHA" origin/main > "$changed_files"
          while IFS= read -r -d '' file; do
            case "$file" in
              node/docs/*|node/*.md|node/.github/release/*|node/*_test.go|node/.gitignore) ;;
              node/*|scripts/resolve-image-tags.sh|.github/workflows/ci-node.yml) runtime_advanced=true ;;
            esac
          done < "$changed_files"
          rm -f "$changed_files"
          if [[ "$runtime_advanced" == true ]]; then
            echo "Node runtime advanced; retain immutable image without rolling dev back"
            exit 0
          fi
          docker buildx imagetools create --tag ghcr.io/anrcm0/tx-node:dev \
            "ghcr.io/anrcm0/tx-node:dev-sha-${GITHUB_SHA:0:12}"

  release-assets:
    name: Attach Node binaries to unified release
    runs-on: ubuntu-latest
    needs: [build, publish-image]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release channel
        id: channel
        working-directory: .
        env:
          TXBOARD_IMAGE_REPO: ghcr.io/anrcm0/tx-node
        run: bash scripts/resolve-image-tags.sh
      - uses: actions/download-artifact@v4
        with:
          pattern: tx-node-linux-*
          merge-multiple: true
          path: node/dist
      # Core/Gateway publish their images independently. This is the one
      # monorepo Release creator; it does not claim those builds are atomic.
      - name: Create unified release if missing and upload Node binaries
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            flags=(--latest)
            if [[ "$CHANNEL" == preview ]]; then
              flags=(--prerelease --latest=false)
            fi
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
              --title "tx-core $RELEASE_TAG" "${flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" dist/tx-node-linux-amd64 dist/tx-node-linux-arm64 --clobber
