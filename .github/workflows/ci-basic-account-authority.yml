name: basic-account-authority

# Historical legacy-model control proof; run only when explicitly requested.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: basic-account-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-account-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: txboard-ci-basic-account-root-only
          MYSQL_DATABASE: txboard_basic_account_test
          MYSQL_USER: txboard_basic_account
          MYSQL_PASSWORD: txboard-ci-basic-account-only
        ports: ['13306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ptxboard-ci-basic-account-root-only"
          --health-interval 5s --health-retries 20
    env:
      APP_ENV: testing
      P0_ACCOUNT_MYSQL: '1'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '13306'
      DB_DATABASE: txboard_basic_account_test
      DB_USERNAME: txboard_basic_account
      DB_PASSWORD: txboard-ci-basic-account-only
      CACHE_DRIVER: array
      SETTING_CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_DRIVER: array
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, pdo_sqlite, bcmath, pcntl, posix
          coverage: none
      - name: Restore locked Core dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Prepare disposable synthetic fixture
        run: |
          touch .env
          mkdir -p storage/framework/{cache/data,sessions,views} storage/logs bootstrap/cache
      - name: Native account suspension, expiry and committed group synchronization
        run: php artisan test --configuration phpunit-historical.xml --filter='NativeUserGroupSyncTest|NativeUserExpiryBoundaryTest|TxapiAdminSuspensionTest'
