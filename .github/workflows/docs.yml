name: Documentation

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'scripts/check-docs.mjs'
      - 'scripts/tests/check-docs.test.mjs'
      - 'scripts/check-ci-policy.py'
      - '.github/workflows/**'
      - 'api/phpunit*.xml'
      - '.gitmodules'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'scripts/check-docs.mjs'
      - 'scripts/tests/check-docs.test.mjs'
      - 'scripts/check-ci-policy.py'
      - '.github/workflows/**'
      - 'api/phpunit*.xml'
      - '.gitmodules'

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test documentation validator fixtures
        run: node --test scripts/tests/check-docs.test.mjs
      - name: Discover first-party documentation
        id: docs
        run: |
          has_docs=$(node scripts/check-docs.mjs --has-docs)
          [[ "$has_docs" == true || "$has_docs" == false ]]
          printf 'has_docs=%s\n' "$has_docs" >> "$GITHUB_OUTPUT"
      - name: Validate local documentation links
        if: steps.docs.outputs.has_docs == 'true'
        run: node scripts/check-docs.mjs
      - name: Report skipped documentation links
        if: steps.docs.outputs.has_docs == 'false'
        run: echo 'SKIP - no first-party Markdown documentation found; link validation not run.'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned workflow parser
        run: python -m pip install PyYAML==6.0.3
      - name: Validate native development CI policy
        run: python scripts/check-ci-policy.py
