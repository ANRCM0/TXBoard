name: node-native-authority-control

on:
  push:
    branches: [main]
    paths: ['api/**', 'node/internal/**', 'node/go.mod', 'node/go.sum', 'scripts/tests/node-native-authority/**', 'contracts/node-protocol/native-authority-denial-v1.md', '.github/workflows/ci-node-native-authority.yml']
  pull_request:
    paths: ['api/**', 'node/internal/**', 'node/go.mod', 'node/go.sum', 'scripts/tests/node-native-authority/**', 'contracts/node-protocol/native-authority-denial-v1.md', '.github/workflows/ci-node-native-authority.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-native-authority-control-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-authority-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        protocol: [vless, vmess]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: txboard-ci-native-control-root-only
          MYSQL_DATABASE: txboard_native_control_test
          MYSQL_USER: txboard_native_control
          MYSQL_PASSWORD: txboard-ci-native-control-only
        ports: ['13306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ptxboard-ci-native-control-root-only"
          --health-interval 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['16379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-retries 20
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '13306'
      DB_DATABASE: txboard_native_control_test
      DB_USERNAME: txboard_native_control
      DB_PASSWORD: txboard-ci-native-control-only
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '16379'
      REDIS_DB: '8'
      REDIS_CACHE_DB: '9'
      GOTOOLCHAIN: local
      CGO_ENABLED: '1'
      NATIVE_CONTROL_PROTOCOL: ${{ matrix.protocol }}
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, bcmath, redis
          coverage: none
      - uses: actions/setup-go@v5
        with:
          go-version-file: node/go.mod
          cache-dependency-path: node/go.sum
      - name: Install local fixture prerequisites
        run: sudo apt-get update && sudo apt-get install -y mariadb-client openssl
      - name: Restore locked Core fixtures and Node dependencies
        run: |
          composer install --working-dir=api --no-interaction --prefer-dist
          cd node
          go mod download
      - name: Prepare disposable Core storage
        run: |
          touch api/.env
          mkdir -p api/storage/framework/{cache/data,sessions,views} api/storage/logs api/bootstrap/cache
      - name: Ordinary native Service disable, stream closure, durable tail and rejected restart
        # Each protocol owns a fresh exclusive DB; no isolated-v2 grant or WS mock.
        run: python3 scripts/tests/node-native-authority/run.py "$PWD/api" "$PWD/node" "$RUNNER_TEMP/node-native-authority-evidence" "$NATIVE_CONTROL_PROTOCOL"
      - name: Preserve sanitized native-control evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-native-authority-${{ matrix.protocol }}
          path: ${{ runner.temp }}/node-native-authority-evidence/result.json
          if-no-files-found: warn
          retention-days: 14