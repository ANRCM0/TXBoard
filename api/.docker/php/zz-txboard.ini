; Slim PHP defaults for the all-in-one container.
; Tunables are overridable via Docker ENV (PHP_MEMORY_LIMIT, etc.) if needed.

memory_limit = 256M

; CVE-2026-115560 (unpatched in every PHP release as of 2026-10-24): PHP's
; recommended mitigation is to disable session upload progress until the next
; regular bugfix release. TXBoard does not use it, so this is free.
session.upload_progress.enabled = 0

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 96
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.fast_shutdown = 1

[swoole]
swoole.use_shortname = Off
