name: bootstrap-creation-shadow

on:
  push:
    branches: [main]
    paths: ['api/**', 'contracts/v2/legacy-bootstrap-creation-shadow-v1.md', '.github/workflows/ci-bootstrap-creation-shadow.yml']
  pull_request:
    paths: ['api/**', 'contracts/v2/legacy-bootstrap-creation-shadow-v1.md', '.github/workflows/ci-bootstrap-creation-shadow.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-creation-shadow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: txboard-ci-bootstrap-creation-root-only
          MYSQL_DATABASE: txboard_bootstrap_creation_test
          MYSQL_USER: txboard_bootstrap_creation
          MYSQL_PASSWORD: txboard-ci-bootstrap-creation-only
        ports: ['13306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ptxboard-ci-bootstrap-creation-root-only"
          --health-interval 5s --health-retries 20
    env:
      APP_ENV: testing
      CORE_BOOTSTRAP_CREATION_TEST_MYSQL: '1'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '13306'
      DB_DATABASE: txboard_bootstrap_creation_test
      DB_USERNAME: txboard_bootstrap_creation
      DB_PASSWORD: txboard-ci-bootstrap-creation-only
      CACHE_DRIVER: array
      SETTING_CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, bcmath
          coverage: none
      - name: Restore locked Core dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Prepare disposable synthetic fixture
        run: |
          touch .env
          mkdir -p storage/framework/{cache/data,sessions,views} storage/logs bootstrap/cache
      - name: Native creation atomic evidence and independent MySQL session visibility
        run: php artisan test --filter=LegacyBootstrapCreationShadowTest
