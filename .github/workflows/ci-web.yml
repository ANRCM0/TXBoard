name: web-ci

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "!web/**/*.md"
      - "package.json"
      - "package-lock.json"
      - "packages/**"
      - "tools/module-host/**"
      - "examples/theme-native/**"
      - "tsconfig.base.json"
      - "contracts/frontend/**"
      - "contracts/core-api/**"
      - "scripts/check-frontend-boundaries.mjs"
      - "scripts/admin-browser.mjs"
      - "scripts/admin-workflows-browser.mjs"
      - "scripts/lib/admin-workflows-fixture.mjs"
      - "scripts/admin-catalog-network-browser.mjs"
      - "scripts/admin-management-browser.mjs"
      - "scripts/lib/admin-management-fixture.mjs"
      - "scripts/lib/admin-catalog-network-fixture.mjs"
      - "scripts/user-browser.mjs"
      - "scripts/check-web-performance.mjs"
      - ".github/workflows/ci-web.yml"
  pull_request:
    paths:
      - "web/**"
      - "!web/**/*.md"
      - "package.json"
      - "package-lock.json"
      - "packages/**"
      - "tools/module-host/**"
      - "examples/theme-native/**"
      - "tsconfig.base.json"
      - "contracts/frontend/**"
      - "contracts/core-api/**"
      - "scripts/check-frontend-boundaries.mjs"
      - "scripts/admin-browser.mjs"
      - "scripts/admin-workflows-browser.mjs"
      - "scripts/lib/admin-workflows-fixture.mjs"
      - "scripts/admin-catalog-network-browser.mjs"
      - "scripts/admin-management-browser.mjs"
      - "scripts/lib/admin-management-fixture.mjs"
      - "scripts/lib/admin-catalog-network-fixture.mjs"
      - "scripts/user-browser.mjs"
      - "scripts/check-web-performance.mjs"
      - ".github/workflows/ci-web.yml"

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run verify:web
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-browser-${{ github.sha }}
          path: |
            artifacts/admin-browser/
            artifacts/admin-workflows-browser/
            artifacts/admin-catalog-network-browser/
            artifacts/admin-management-browser/
            artifacts/user-browser/
          if-no-files-found: ignore
