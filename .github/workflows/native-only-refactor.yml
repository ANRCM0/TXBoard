name: native-only-rewrite-once
on:
  push:
    branches: [refactor/native-tx-only-20261010]
permissions:
  contents: write
jobs:
  codemod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/native-tx-only-20261010
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply native-only cleanup to source
        run: |
          node scripts/refactor-native-tx-only.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore -- .github/workflows
          git add -A
          git diff --cached --stat
          git diff --cached --quiet || (git commit -m "refactor(database)!: native tx-only schema, retire legacy V2 compatibility" && git push origin HEAD:refactor/native-tx-only-20261010)
