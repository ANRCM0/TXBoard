    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: c2-native-root-fixture
          MYSQL_DATABASE: txboard_c2_native_test
          MYSQL_USER: c2_native
          MYSQL_PASSWORD: c2-native-user-fixture
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=c2-native-root-fixture"
          --health-interval 5s --health-retries 20
    env:
      APP_ENV: testing
      CORE_NATIVE_TEST_MYSQL: '1'
      CORE_INSTALLATION_MODE: legacy
      CORE_INSTALLATION_EPOCH: '1'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: txboard_c2_native_test
      DB_USERNAME: c2_native
      DB_PASSWORD: c2-native-user-fixture
      CACHE_DRIVER: array
      SETTING_CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, pdo_sqlite, curl, openssl, sodium, redis, bcmath, pcntl, posix
          coverage: none
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Prepare disposable fixture
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Apply native production schema
        run: php artisan migrate --force --no-interaction
      - name: Native domain transactions and application adapters on MySQL 8.4
        run: php artisan test ${{ matrix.test_files }}
      - name: Native receipt concurrency and SQL crash recovery on MySQL 8.4
        if: matrix.run_usage_concurrency == true
        run: php artisan test tests/Feature/UsageV2/UsageMysqlConcurrencyTest.php

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Audit locked JavaScript dependencies
        timeout-minutes: 5
        run: |
          mkdir -p artifacts/security
          npm audit --package-lock-only --ignore-scripts --audit-level=high --json > artifacts/security/npm-audit.json
      - run: npm run verify:web
      - run: npx playwright install --with-deps chromium
      - name: Verify actual management development server in Chromium
        run: npm run test:dev-browser --workspace @txboard/admin
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-browser-${{ github.sha }}
          path: |
            artifacts/admin-dev-browser/*.png
            artifacts/admin-dev-browser/result.json
            artifacts/admin-browser/
            artifacts/admin-workflows-browser/
            artifacts/admin-catalog-network-browser/
            artifacts/admin-management-browser/
            artifacts/user-browser/
            artifacts/admin-native-wave/code-editor-browser-result.json
            artifacts/admin-native-wave/subscription-template-editor-*.png
            artifacts/security/npm-audit.json
          if-no-files-found: ignore

  browser-native-http:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: core-browser-root-fixture
          MARIADB_ROOT_HOST: '%'
        ports: ['13306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['16379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, pdo_sqlite, curl, openssl, sodium, redis, bcmath, pcntl, posix
          coverage: none
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: node/go.mod
          cache-dependency-path: node/go.sum
      - name: Validate native commerce fixture syntax
        run: |
          python3 scripts/check-browser-core-surface.py
          bash -n scripts/tests/core-browser/run-linux.sh
          php -l scripts/tests/core-browser/core-fixture.php
          node --check scripts/tests/core-browser/core-browser.mjs
          node --check scripts/tests/core-browser/renderer-delivery.mjs
          node --check scripts/tests/core-browser/support-workflow.mjs
          node --check scripts/tests/core-browser/financial-workflow.mjs
      - name: Install isolated integration dependencies
        working-directory: .
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mariadb-client
          cd api
          composer install --no-interaction --prefer-dist
          cd ..
          npm ci --no-audit --no-fund
      - name: Test isolated module host in Chromium
        run: |
          npm run build:sdk
          npm run build --workspace @txboard/module-host
          npx playwright install --with-deps chromium
          node --test scripts/tests/core-browser/module-host.test.mjs
      - name: Published offers, support, financial workflows and renderer delivery through actual Core browser HTTP
        env:
          TXBOARD_CORE_REPO: ${{ github.workspace }}
          TXBOARD_CORE_VENDOR: ${{ github.workspace }}/api/vendor
          MYSQL_TEST_HOST: 127.0.0.1
          MYSQL_TEST_PORT: '13306'
          MYSQL_TEST_ROOT_PASSWORD: core-browser-root-fixture
          REDIS_TEST_PORT: '16379'
          CORE_BROWSER_INTEGRATION_SCRATCH: ${{ runner.temp }}
        run: bash scripts/tests/core-browser/run-linux.sh
      - name: Retain bounded non-secret native commerce evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-browser-commerce-${{ github.sha }}
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/core-browser.*/core-browser-result.json
            ${{ runner.temp }}/core-browser.*/fixture.json

  native-c2-live:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:7.4
        ports: ['6379:6379']
        options: --health-cmd="redis-cli ping" --health-interval 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, curl, openssl, sodium, bcmath, redis
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version-file: node/go.mod
          cache-dependency-path: node/go.sum
      - name: Prepare Core
        working-directory: api
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          APP_ENV=testing php artisan key:generate
      - name: Actual native activation, identity, queue, render, traffic and settlement
        run: |
          python3 scripts/check-node-component.py
          python3 scripts/verify-native-c2.py

  static:
    name: Static and documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test documentation validator fixtures
        run: node --test scripts/tests/check-docs.test.mjs
      - name: Discover first-party documentation
        id: docs
        run: |
          has_docs=$(node scripts/check-docs.mjs --has-docs)
          [[ "$has_docs" == true || "$has_docs" == false ]]
          printf 'has_docs=%s\n' "$has_docs" >> "$GITHUB_OUTPUT"
      - name: Validate local documentation links
        if: steps.docs.outputs.has_docs == 'true'
        run: node scripts/check-docs.mjs
      - name: Report skipped documentation links
        if: steps.docs.outputs.has_docs == 'false'
        run: echo 'SKIP - no first-party Markdown documentation found; link validation not run.'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned workflow parser
        run: python -m pip install PyYAML==6.0.3
      - name: Validate native development CI policy
        run: python scripts/check-ci-policy.py
      - name: Test CI selection and policy regressions
        run: |
          python3 -m unittest discover -s scripts/tests -p test_select_ci_jobs.py
          python3 -m unittest discover -s scripts/tests -p test_check_ci_policy.py

  acceptance:
    name: CI acceptance
    if: ${{ always() }}
    needs: [changes, static, api, mysql-regression, installation-bootstrap, native-admin-management, native-billing-domain, native-subscription-domain, web, browser-native-http, native-c2-live]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in results.items() if job['result'] not in ('success', 'skipped')]
          if results['changes']['result'] != 'success' or results['static']['result'] != 'success':
              raise SystemExit('CI selection and static checks must succeed')
          if failed:
              raise SystemExit('CI checks did not succeed: ' + ', '.join(failed))
          print('All selected CI checks passed.')
          PY
