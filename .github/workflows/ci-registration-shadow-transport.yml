name: registration-shadow-transport

on:
  push:
    branches: [main]
    paths: ['api/**', 'gateway/**', 'scripts/tests/internal-readonly/**', '.github/workflows/ci-registration-shadow-transport.yml']
  pull_request:
    paths: ['api/**', 'gateway/**', 'scripts/tests/internal-readonly/**', '.github/workflows/ci-registration-shadow-transport.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registration-shadow-transport-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: txboard-ci-registration-transport-root-only
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: txboard_registration_transport_test
          MYSQL_USER: txboard_registration_transport
          MYSQL_PASSWORD: txboard-ci-registration-transport-only
        ports: ['13306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ptxboard-ci-registration-transport-root-only"
          --health-interval 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['16380:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-retries 20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '13306'
      DB_DATABASE: txboard_registration_transport_test
      DB_USERNAME: txboard_registration_transport
      DB_PASSWORD: txboard-ci-registration-transport-only
      INTERNAL_REGISTRATION_SHADOW_VERIFY: 'true'
      INTERNAL_EXPECTED_CORE_COMMIT: ${{ github.sha }}
      INTERNAL_EMAIL_REDIS_PORT: '16380'
      REDIS_PREFIX: 'registration-transport-ci-fixture:'
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, bcmath, redis
          coverage: none
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.2'
      - name: Restore locked Core dependencies
        run: composer install --working-dir=api --no-interaction --prefer-dist
      - name: Permit synthetic evidence fault trigger
        run: |
          php -r '$db = new PDO("mysql:host=127.0.0.1;port=13306;dbname=txboard_registration_transport_test", "root", "txboard-ci-registration-transport-root-only", [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); $db->exec("SET GLOBAL log_bin_trust_function_creators=1");'
      - name: Prepare disposable fixture storage and fixed source identifier
        run: |
          touch api/.env
          mkdir -p api/storage/framework/{cache/data,sessions,views} api/storage/logs api/bootstrap/cache
          node -e 'require("node:fs").writeFileSync("manifest.json", JSON.stringify({base: process.env.INTERNAL_EXPECTED_CORE_COMMIT}))'
      - name: Restore locked Gateway dependencies and verify consumer
        run: |
          npm ci --prefix gateway --no-audit --no-fund
          npm run check --prefix gateway
      - name: Real SDK Gateway Core mTLS registration and evidence failure verification
        run: bash gateway/tests/integration/run-internal-register-linux.sh "$PWD/api"
      - name: Preserve sanitized integration receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registration-shadow-transport-evidence
          path: /tmp/txboard-internal-user-gateway.*/result.json
          if-no-files-found: warn
          retention-days: 14
