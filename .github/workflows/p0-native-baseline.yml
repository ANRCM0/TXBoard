name: p0-native-baseline

on:
  push:
    branches: [main]
    paths:
      - "scripts/p0-api-audit.mjs"
      - "scripts/export-route-catalog.mjs"
      - "scripts/database-schema-inventory.mjs"
      - "scripts/tests/database-schema-inventory.test.mjs"
      - "scripts/tests/export-route-catalog.test.mjs"
      - "contracts/http/external-adapter-current.md"
      - "scripts/tests/p0-api-audit.test.mjs"
      - "scripts/native-admin-release-audit.mjs"
      - "scripts/tests/native-admin-release-audit.test.mjs"
      - "web/admin/src/api/**"
      - "api/**"
      - ".github/workflows/p0-native-baseline.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/p0-api-audit.mjs"
      - "scripts/export-route-catalog.mjs"
      - "scripts/database-schema-inventory.mjs"
      - "scripts/tests/database-schema-inventory.test.mjs"
      - "scripts/tests/export-route-catalog.test.mjs"
      - "contracts/http/external-adapter-current.md"
      - "scripts/tests/p0-api-audit.test.mjs"
      - "scripts/native-admin-release-audit.mjs"
      - "scripts/tests/native-admin-release-audit.test.mjs"
      - "web/admin/src/api/**"
      - "api/**"
      - ".github/workflows/p0-native-baseline.yml"

permissions:
  contents: read

jobs:
  inventory-and-contracts:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_DRIVER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      SETTING_CACHE_STORE: array
      AGENT_OPS_PAIRING_CACHE_STORE: array
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test read-only database schema inventory
        run: node --test scripts/tests/database-schema-inventory.test.mjs
      - name: Inventory V2 schema references and proposed native names
        run: node scripts/database-schema-inventory.mjs --root . --output artifacts/database/schema-inventory.json --check
      - name: Preserve schema cutover inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: txboard-database-schema-inventory
          path: artifacts/database/schema-inventory.json
          if-no-files-found: warn
          retention-days: 14
      - name: Test P0 evidence generator
        run: node --test scripts/tests/p0-api-audit.test.mjs
      - name: Test native Admin release inventory
        run: node --test scripts/tests/native-admin-release-audit.test.mjs
      - name: Capture native Admin V2 remaining call sites
        run: node scripts/native-admin-release-audit.mjs --strict --guard-native --output artifacts/release/admin-native-gap.json
      - name: Publish native Admin release-gap inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: txboard-admin-native-release-gaps
          path: artifacts/release/admin-native-gap.json
          if-no-files-found: warn
          retention-days: 14
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, sqlite3, pdo_sqlite, redis
          coverage: none
      - name: Install PHP dependencies
        working-directory: api
        run: composer install --no-interaction --prefer-dist
      - name: Prepare isolated Laravel application
        working-directory: api
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Export route registry and audit old consumers
        run: |
          php api/artisan route:list --json > "$RUNNER_TEMP/p0-routes.json"
          node scripts/p0-api-audit.mjs --routes "$RUNNER_TEMP/p0-routes.json" --output-dir artifacts/p0-audit
      - name: Verify route catalog exporter
        run: node --test scripts/tests/export-route-catalog.test.mjs
      - name: Export and guard live HTTP route catalog
        run: |
          node scripts/export-route-catalog.mjs \
            --routes "$RUNNER_TEMP/p0-routes.json" \
            --json artifacts/route-catalog/http-routes.json \
            --markdown artifacts/route-catalog/http-routes.md \
            --check
      - name: Preserve HTTP route catalog (no credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: txboard-http-route-catalog
          path: artifacts/route-catalog/
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve P0 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: txboard-p0-api-inventory
          path: artifacts/p0-audit/
          if-no-files-found: warn
          retention-days: 14
      - name: Guard compatibility routes and middleware
        working-directory: api
        run: php artisan test tests/Feature/Contract/LegacyApiBoundaryTest.php
      - name: P0-B synthetic purchase-to-traffic journey
        working-directory: api
        run: php artisan test tests/Feature/Journey/CorePurchaseTrafficJourneyTest.php
      - name: Core billing and node regression slices
        working-directory: api
        run: |
          php artisan test tests/Feature/Payment/PaymentWebhookTest.php
          php artisan test tests/Unit/Services/OrderServiceConcurrencyTest.php
          php artisan test tests/Feature/Server/NodeProtocolContractTest.php
          php artisan test tests/Feature/Server/TrafficBatchSettlementTest.php
