name: legacy-subscription-links-shadow

on:
  push:
    branches: [main]
    paths: ['api/**', 'contracts/v2/legacy-subscription-link-digest-v1.md', '.github/workflows/ci-legacy-subscription-links.yml']
  pull_request:
    paths: ['api/**', 'contracts/v2/legacy-subscription-link-digest-v1.md', '.github/workflows/ci-legacy-subscription-links.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-subscription-links-shadow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: txboard-ci-legacy-link-root-only
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: txboard_legacy_link_test
          MYSQL_USER: txboard_legacy_link
          MYSQL_PASSWORD: txboard-ci-legacy-link-only
        ports: ['13306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ptxboard-ci-legacy-link-root-only"
          --health-interval 5s --health-retries 20
    env:
      APP_ENV: testing
      CORE_LEGACY_LINK_TEST_MYSQL: '1'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '13306'
      DB_DATABASE: txboard_legacy_link_test
      DB_USERNAME: txboard_legacy_link
      DB_PASSWORD: txboard-ci-legacy-link-only
      CACHE_DRIVER: array
      SETTING_CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, bcmath
          coverage: none
      - name: Restore locked Core dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Permit synthetic link-insert failure trigger
        run: |
          php -r '$db=new PDO("mysql:host=127.0.0.1;port=13306;dbname=txboard_legacy_link_test", "root", "txboard-ci-legacy-link-root-only", [PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]); $db->exec("SET GLOBAL log_bin_trust_function_creators=1");'
      - name: Prepare disposable synthetic fixture
        run: |
          touch .env
          mkdir -p storage/framework/{cache/data,sessions,views} storage/logs bootstrap/cache
      - name: Native legacy URL compatibility and digest backfill with MySQL JSON
        run: php artisan test --filter=LegacySubscriptionLinkTest
