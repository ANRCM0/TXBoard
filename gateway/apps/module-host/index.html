<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'nonce-__MODULE_HOST_NONCE__'; img-src data:; font-src data:; style-src 'unsafe-inline'; connect-src https: http://127.0.0.1:* http://localhost:*; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="module-script-nonce" content="__MODULE_HOST_NONCE__"><title>Core module workbench</title>
<style>
:root{--ink:#193c38;--paper:#f3eee2;--line:#c4cdbb;--accent:#ca5939}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:repeating-linear-gradient(90deg,transparent,transparent 47px,#193c3808 48px),var(--paper);font-family:Georgia,serif}main{max-width:1180px;margin:auto;padding:48px 32px}small{font:12px monospace;letter-spacing:.16em}h1{font-size:clamp(34px,6vw,64px);font-weight:400;letter-spacing:-.04em;margin:12px 0}p{line-height:1.6}form{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px;padding:24px 0;border-block:1px solid var(--line)}label{display:grid;gap:7px;font:13px monospace}input,select,button{font:15px monospace;border:1px solid var(--line);padding:11px;background:#fffaf0;color:var(--ink);min-width:0}button{cursor:pointer;background:var(--ink);color:white;border:0}.wide{grid-column:span 2}#status{min-height:24px;font:14px monospace;color:var(--accent)}.workspace{display:grid;grid-template-columns:240px 1fr;gap:28px;margin-top:26px}nav button{width:100%;text-align:left;background:#e0e5d4;color:var(--ink)}iframe{width:100%;min-height:420px;border:1px solid var(--line);background:white}#configuration{display:grid;gap:12px;margin-top:18px}pre{white-space:pre-wrap;word-break:break-word;font-size:12px}@media(max-width:680px){main{padding:28px 18px}form,.workspace{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body><main>
<small>CORE / EXTENSION ACCEPTANCE</small><h1>Module workbench.</h1>
<p>A minimal host for checking module navigation, configuration, permissions and SDK calls.</p>
<form id="connect"><label>Core origin<input id="origin" required type="url" placeholder="https://core.example.test"></label><label>Actor<select id="actor"><option>admin</option><option>user</option></select></label><label>Admin path<input id="admin-path" autocomplete="off"></label><label class="wide">Session token<input id="token" type="password" required autocomplete="off"></label><label>Module code<input id="module" value="module_portal" required pattern="[a-z][a-z0-9_]{0,63}"></label><button>Open module</button></form>
<p id="status" role="status">Ready to connect.</p><section class="workspace"><nav><button id="navigation" hidden></button><form id="configuration" hidden></form><pre id="details"></pre></nav><section id="surface"></section></section>
</main><script type="module" src="/host.js"></script></body></html>
