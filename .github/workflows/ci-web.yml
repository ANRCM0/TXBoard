name: web-ci

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "!web/**/*.md"
      - "package.json"
      - "package-lock.json"
      - "gateway/packages/core-sdk/**"
      - "gateway/tsconfig.base.json"
      - "contracts/frontend/**"
      - "contracts/core-api/**"
      - "scripts/check-admin-migration.mjs"
      - "scripts/admin-browser.mjs"
      - "scripts/user-browser.mjs"
      - "scripts/check-web-performance.mjs"
      - ".github/workflows/ci-web.yml"
  pull_request:
    paths:
      - "web/**"
      - "!web/**/*.md"
      - "package.json"
      - "package-lock.json"
      - "gateway/packages/core-sdk/**"
      - "gateway/tsconfig.base.json"
      - "contracts/frontend/**"
      - "contracts/core-api/**"
      - "scripts/check-admin-migration.mjs"
      - "scripts/admin-browser.mjs"
      - "scripts/user-browser.mjs"
      - "scripts/check-web-performance.mjs"
      - ".github/workflows/ci-web.yml"

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run verify:web
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-browser-${{ github.sha }}
          path: |
            artifacts/admin-browser/
            artifacts/user-browser/
          if-no-files-found: ignore
