name: txboard-image

on:
  # Every main commit updates the independent development image channel.
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
    paths:
      - "api/**"
      - "web/**"
      - "mcp/**"
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "package-lock.json"
      - "compose.yaml"
      - "backup.sh"
      - "scripts/test-backup.sh"
      - "scripts/ci-release-recovery.sh"
      - "scripts/resolve-image-tags.sh"
      - "scripts/test-image-tags.sh"
      - ".github/workflows/docker-txboard.yml"

permissions:
  contents: read
  packages: write

# Branch builds cannot replace stable or preview; different release tags are
# serialized by channel so a slower older tag cannot overwrite the channel.
concurrency:
  group: txboard-image-${{ github.event_name == 'pull_request' && github.ref || (github.ref_type == 'branch' && 'dev' || (contains(github.ref_name, '-') && 'preview' || 'stable')) }}
  cancel-in-progress: true

jobs:
  # A passing image build alone is not release qualification. Run regression
  # checks on the exact Git commit for PR, dev, preview and stable channels.
  release-gate:
    # Tag releases use exactly the same validation as pull requests and main.
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_DRIVER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      SETTING_CACHE_STORE: array
      AGENT_OPS_PAIRING_CACHE_STORE: array
    steps:
      - uses: actions/checkout@v4
      - name: Test image tag classification
        run: bash scripts/test-image-tags.sh
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, sqlite3, pdo_sqlite, redis
          coverage: none
      - name: Install API dependencies
        working-directory: api
        run: composer install --no-interaction --prefer-dist
      - name: Prepare API test environment
        working-directory: api
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: API regression tests
        working-directory: api
        run: php artisan test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify web typecheck, tests, build and performance budget
        run: npm run verify:web
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install MCP dependencies
        working-directory: mcp
        run: npm install --no-audit --no-fund
      - name: Verify MCP typecheck and build
        working-directory: mcp
        run: |
          npm run typecheck
          npm run build

  release-recovery:
    # Protect stable/preview publishing with a MySQL upgrade+restore check.
    # This is synthetic CI evidence, not an operator's real backup/rollback.
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: release-ci-root
          MYSQL_DATABASE: txboard_release_ci
          MYSQL_USER: txboard_release_ci
          MYSQL_PASSWORD: release-ci-user
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=release-ci-root"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: txboard_release_ci
      DB_USERNAME: txboard_release_ci
      DB_PASSWORD: release-ci-user
      MYSQL_ROOT_PASSWORD: release-ci-root
      TXBOARD_CI_RESTORE: "1"
      CACHE_DRIVER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      SETTING_CACHE_STORE: array
      AGENT_OPS_PAIRING_CACHE_STORE: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_mysql, mysqlnd, redis
          coverage: none
      - name: Install API dependencies
        working-directory: api
        run: composer install --no-interaction --prefer-dist
      - name: Prepare isolated test .env
        working-directory: api
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Lint release/backup runner scripts
        run: |
          bash -n scripts/ci-release-recovery.sh
          sh -n backup.sh
      - name: Migrate synthetic existing MySQL data, back up and restore
        run: bash scripts/ci-release-recovery.sh
      - name: Preserve non-secret synthetic restore evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: txboard-release-recovery-synthetic
          path: api/artifacts/release-recovery.json
          if-no-files-found: warn
          retention-days: 14

  verify:
    # Smoke-test actual runtime on PR, main and release tags.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify backup integrity and mysqldump failure handling
        run: bash scripts/test-backup.sh backup.sh
      - name: Validate Compose
        env:
          TXBOARD_DB_PASSWORD: test-password
          TXBOARD_DB_ROOT_PASSWORD: test-root-password
        run: docker compose config >/dev/null
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: txboard-ci:pr
          platforms: linux/amd64
          build-args: |
            APP_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=txboard
          cache-to: type=gha,mode=max,scope=txboard
          provenance: false
      - name: Verify runtime healthcheck is embedded in image
        run: |
          docker run --rm --entrypoint sh txboard-ci:pr -c \
            'test -f /opt/txboard/healthcheck.php'
      - name: Verify embedded MCP runtime
        run: |
          docker run --rm --entrypoint sh txboard-ci:pr -c '
            test -f /opt/txboard-mcp/dist/index.js
            test -d /opt/txboard-mcp/node_modules
            node -e "const major=Number(process.versions.node.split(\".\")[0]); if (major < 20) process.exit(1)"
          '
      - name: Verify PHP database runtime dependencies
        run: |
          docker run --rm --entrypoint php txboard-ci:pr -r '
            $drivers = PDO::getAvailableDrivers();
            foreach (["mysql", "sqlite"] as $driver) {
                if (!in_array($driver, $drivers, true)) {
                    fwrite(STDERR, "Missing PDO driver: {$driver}\\n");
                    exit(1);
                }
            }
            echo "PDO drivers: ".implode(", ", $drivers)."\\n";
          '
      - name: Report image footprint
        shell: bash
        run: |
          bytes="$(docker image inspect txboard-ci:pr --format '{{.Size}}')"
          mib="$(awk -v b="$bytes" 'BEGIN { printf "%.1f", b / 1024 / 1024 }')"
          echo "TXBoard local image size: ${mib} MiB (${bytes} bytes)"

          docker run --rm --entrypoint sh txboard-ci:pr -c \
            'du -sh /www /www/vendor /srv /usr/local/lib/php/extensions /usr/bin/caddy /usr/bin/redis-server 2>/dev/null || true' \
            | tee /tmp/txboard-footprint.txt

          {
            echo "### TXBoard image footprint"
            echo
            echo "- Local uncompressed image size: **${mib} MiB** (${bytes} bytes)"
            echo
            echo "#### Runtime paths"
            echo '~~~text'
            cat /tmp/txboard-footprint.txt
            echo '~~~'
            echo
            echo "#### Docker layers"
            echo '~~~text'
            docker history txboard-ci:pr --format '{{.Size}}\t{{.CreatedBy}}'
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke-test Octane runtime
        shell: bash
        run: |
          docker run -d --name txboard-smoke \
            -e DB_CONNECTION=sqlite \
            -e DB_DATABASE=/tmp/txboard-smoke.sqlite \
            -e ENABLE_HORIZON=false \
            -e ENABLE_WS_SERVER=false \
            txboard-ci:pr
          ok=0
          for i in {1..30}; do
            if docker exec txboard-smoke php /opt/txboard/healthcheck.php; then
              ok=1
              break
            fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            docker logs txboard-smoke
            exit 1
          fi
          # Test the actual Caddy -> Octane HTTP response, not only the PHP
          # process healthcheck. These endpoints intentionally do not use DB.
          docker exec txboard-smoke php -r '
            foreach (["/api/health", "/txapi/health"] as $path) {
                $socket = fsockopen("127.0.0.1", 80, $errno, $errstr, 2);
                if (!$socket) { fwrite(STDERR, "HTTP socket unavailable\n"); exit(1); }
                fwrite($socket, "GET {$path} HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n");
                $response = stream_get_contents($socket);
                fclose($socket);
                if (!preg_match("~^HTTP/1\\.[01] 200 ~", $response) ||
                    !str_contains($response, "\"status\":\"ok\"")) {
                    fwrite(STDERR, "Native/legacy liveness HTTP failed on {$path}\n");
                    exit(1);
                }
            }
          '
          docker exec txboard-smoke php -r '
            $socket = fsockopen("127.0.0.1", 80, $errno, $errstr, 2);
            fwrite($socket, "GET /mcp HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n");
            $status = fgets($socket);
            fclose($socket);
            if (!is_string($status) || !str_contains($status, " 404 ")) {
                fwrite(STDERR, "Expected disabled /mcp to return 404, got: ".($status ?: "<none>")."\n");
                exit(1);
            }
          '
          docker rm -f txboard-smoke
      - name: Smoke-test embedded MCP gateway
        shell: bash
        run: |
          docker run -d --name txboard-mcp-smoke \
            -e DB_CONNECTION=sqlite \
            -e DB_DATABASE=/tmp/txboard-mcp-smoke.sqlite \
            -e ENABLE_HORIZON=false \
            -e ENABLE_WS_SERVER=false \
            -e ENABLE_MCP=true \
            txboard-ci:pr
          ok=0
          for i in {1..30}; do
            if docker exec txboard-mcp-smoke php /opt/txboard/healthcheck.php; then
              ok=1
              break
            fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            docker logs txboard-mcp-smoke
            exit 1
          fi
          docker exec txboard-mcp-smoke php -r '
            $socket = fsockopen("127.0.0.1", 80, $errno, $errstr, 2);
            fwrite($socket, "GET /mcp HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n");
            $status = fgets($socket);
            fclose($socket);
            if (!is_string($status) || !str_contains($status, " 401 ")) {
                fwrite(STDERR, "Expected enabled /mcp without bearer token to return 401, got: ".($status ?: "<none>")."\n");
                exit(1);
            }
          '
          docker rm -f txboard-mcp-smoke

  publish:
    # PRs validate but never push. Only a main commit or a vetted semver Git
    # tag may publish; neither can overwrite the other channel.
    if: github.event_name == 'push'
    needs: [release-gate, release-recovery, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve dev / preview / stable image tags
        id: channel
        env:
          TXBOARD_IMAGE_REPO: ghcr.io/anrcm0/txboard
        run: bash scripts/resolve-image-tags.sh
      - name: Reject release tags not contained in main
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Release Git tags must reference a commit already on main."
            exit 1
          fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=txboard
          cache-to: type=gha,mode=max,scope=txboard
          tags: ${{ steps.channel.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          provenance: false
      - name: Report published channel
        env:
          RELEASE_CHANNEL: ${{ steps.channel.outputs.channel }}
          RELEASE_TAGS: ${{ steps.channel.outputs.tags }}
        shell: bash
        run: |
          {
            echo "### Published TXBoard ${RELEASE_CHANNEL} image"
            echo
            printf '%s\\n' "$RELEASE_TAGS" | sed 's/^/- `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
