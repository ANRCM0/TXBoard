name: Documentation

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'scripts/check-docs.mjs'
      - 'scripts/check-ci-policy.py'
      - '.github/workflows/**'
      - 'node/Makefile'
      - 'api/phpunit*.xml'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'scripts/check-docs.mjs'
      - 'scripts/check-ci-policy.py'
      - '.github/workflows/**'
      - 'node/Makefile'
      - 'api/phpunit*.xml'

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate local documentation links
        run: node scripts/check-docs.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned workflow parser
        run: python -m pip install PyYAML==6.0.3
      - name: Validate native development CI policy
        run: python scripts/check-ci-policy.py
