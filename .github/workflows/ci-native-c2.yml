name: native-c2

on:
  pull_request:
    paths:
      - 'api/**'
      - 'node/**'
      - 'contracts/v2/**'
      - 'scripts/tests/native-c2/**'
      - 'scripts/verify-native-c2.py'
      - 'scripts/verify-native-provider-node.py'
      - 'scripts/native-subscription-client.mjs'
      - '.github/workflows/ci-native-c2.yml'
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'node/**'
      - 'contracts/v2/**'
      - 'scripts/tests/native-c2/**'
      - 'scripts/verify-native-c2.py'
      - 'scripts/verify-native-provider-node.py'
      - 'scripts/native-subscription-client.mjs'
      - '.github/workflows/ci-native-c2.yml'

permissions:
  contents: read

concurrency:
  group: native-c2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-c2-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_DRIVER: array
      SETTING_CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      CORE_INSTALLATION_MODE: legacy
      CORE_INSTALLATION_EPOCH: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, curl, openssl, sodium, bcmath, redis
          coverage: none
      - name: Prepare Core
        working-directory: api
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate
      - name: Syntax and native domain boundaries
        working-directory: api
        run: |
          find app config database/migrations tests -name '*.php' -print0 | xargs -0 -n1 php -l > /tmp/native-c2-php-syntax.log
          php artisan test tests/Unit/Domains/CredentialProvider tests/Feature/Installation tests/Feature/Subscription tests/Feature/UsageV2 tests/Feature/Txapi/TxapiNativeCredentialProviderTest.php
      - name: Registered HTTP and native schema contracts
        run: |
          cd api
          php artisan route:list --json > ../route-list.json
          cd ..
          node scripts/export-route-catalog.mjs --routes route-list.json --json /tmp/native-c2-routes.json --markdown /tmp/native-c2-routes.md --check
          node scripts/check-external-integration-routes.mjs --routes route-list.json
          node scripts/check-native-schema-only.mjs --check
          node --check scripts/native-subscription-client.mjs

  native-c2-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: native-c2-root-fixture
          MYSQL_DATABASE: txboard_c2_native_test_closeout
          MYSQL_USER: native_c2_test
          MYSQL_PASSWORD: native-c2-user-fixture
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=native-c2-root-fixture"
          --health-interval 5s --health-retries 20
    env:
      APP_ENV: testing
      CORE_NATIVE_TEST_MYSQL: '1'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_DATABASE: txboard_c2_native_test_closeout
      DB_USERNAME: native_c2_test
      DB_PASSWORD: native-c2-user-fixture
      CACHE_DRIVER: array
      SETTING_CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      CORE_INSTALLATION_MODE: legacy
      CORE_INSTALLATION_EPOCH: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, pdo_sqlite, curl, openssl, sodium, bcmath, redis
          coverage: none
      - name: Production migrations and transactional native boundaries
        working-directory: api
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
          php artisan test tests/Feature/Subscription/NativeCredentialProviderTest.php tests/Feature/Subscription/NativeProviderNodeAuthorizationTest.php tests/Feature/Subscription/NativeSubscriptionDeliveryTest.php tests/Feature/Installation/NativeRuntimeReadinessTest.php tests/Feature/UsageV2/NativeRuntimeUsageTest.php

  native-c2-node:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: node/go.mod
          cache-dependency-path: node/go.sum
      - name: Provider, Node runtime and durable usage race checks
        working-directory: node
        run: >-
          go test -race
          ./internal/credentialprovider ./internal/credentialdelivery
          ./internal/credentialdeliveryclient ./internal/authorization
          ./internal/config ./internal/txboard ./internal/controlplane
          ./internal/usageinterval ./internal/usagev2 ./internal/kernel/singbox
          ./internal/service ./cmd/tx-node ./cmd/credential-provider

  native-c2-live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:7.4
        ports: ['6379:6379']
        options: --health-cmd="redis-cli ping" --health-interval 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, curl, openssl, sodium, bcmath, redis
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version-file: node/go.mod
          cache-dependency-path: node/go.sum
      - name: Prepare Core
        working-directory: api
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          APP_ENV=testing php artisan key:generate
      - name: Actual native activation, identity, queue, render, traffic and settlement
        run: python3 scripts/verify-native-c2.py
