name: native-c2

on:
  pull_request:
    paths:
      - 'api/app/Domains/Installation/**'
      - 'api/app/Domains/Account/**'
      - 'api/app/Domains/Billing/**'
      - 'api/app/Domains/Subscription/**'
      - 'api/app/Domains/CredentialProvider/**'
      - 'api/app/Domains/UsageV2/**'
      - 'api/app/Domains/Network/**'
      - 'api/app/Services/Subscription/**'
      - 'api/app/Services/Auth/**'
      - 'api/app/Services/OrderService.php'
      - 'api/app/Jobs/**'
      - 'api/app/Providers/**'
      - 'api/app/Listeners/**'
      - 'api/app/Http/Controllers/Txapi/**'
      - 'api/app/Http/Middleware/**'
      - 'api/app/Models/**'
      - 'api/database/migrations/**'
      - 'api/config/**'
      - 'api/routes/**'
      - 'api/bootstrap/**'
      - 'api/composer.*'
      - 'node/internal/credentialprovider/**'
      - 'node/internal/credentialdelivery/**'
      - 'node/internal/credentialdeliveryclient/**'
      - 'node/internal/authorization/**'
      - 'node/internal/config/**'
      - 'node/internal/txboard/**'
      - 'node/internal/controlplane/**'
      - 'node/internal/usageinterval/**'
      - 'node/internal/usagev2/**'
      - 'node/internal/kernel/singbox/**'
      - 'node/internal/service/**'
      - 'node/cmd/**'
      - 'node/go.mod'
      - 'node/go.sum'
      - '!api/**/*.md'
      - '!node/**/*.md'
      - 'scripts/tests/native-c2/**'
      - 'scripts/verify-native-c2.py'
      - 'scripts/verify-native-provider-node.py'
      - 'scripts/tests/native-provider-node/**'
      - 'scripts/native-subscription-client.mjs'
      - '.github/workflows/ci-native-c2.yml'
  push:
    branches: [main]
    paths:
      - 'api/app/Domains/Installation/**'
      - 'api/app/Domains/Account/**'
      - 'api/app/Domains/Billing/**'
      - 'api/app/Domains/Subscription/**'
      - 'api/app/Domains/CredentialProvider/**'
      - 'api/app/Domains/UsageV2/**'
      - 'api/app/Domains/Network/**'
      - 'api/app/Services/Subscription/**'
      - 'api/app/Services/Auth/**'
      - 'api/app/Services/OrderService.php'
      - 'api/app/Jobs/**'
      - 'api/app/Providers/**'
      - 'api/app/Listeners/**'
      - 'api/app/Http/Controllers/Txapi/**'
      - 'api/app/Http/Middleware/**'
      - 'api/app/Models/**'
      - 'api/database/migrations/**'
      - 'api/config/**'
      - 'api/routes/**'
      - 'api/bootstrap/**'
      - 'api/composer.*'
      - 'node/internal/credentialprovider/**'
      - 'node/internal/credentialdelivery/**'
      - 'node/internal/credentialdeliveryclient/**'
      - 'node/internal/authorization/**'
      - 'node/internal/config/**'
      - 'node/internal/txboard/**'
      - 'node/internal/controlplane/**'
      - 'node/internal/usageinterval/**'
      - 'node/internal/usagev2/**'
      - 'node/internal/kernel/singbox/**'
      - 'node/internal/service/**'
      - 'node/cmd/**'
      - 'node/go.mod'
      - 'node/go.sum'
      - '!api/**/*.md'
      - '!node/**/*.md'
      - 'scripts/tests/native-c2/**'
      - 'scripts/verify-native-c2.py'
      - 'scripts/verify-native-provider-node.py'
      - 'scripts/tests/native-provider-node/**'
      - 'scripts/native-subscription-client.mjs'
      - '.github/workflows/ci-native-c2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-c2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-c2-live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:7.4
        ports: ['6379:6379']
        options: --health-cmd="redis-cli ping" --health-interval 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, curl, openssl, sodium, bcmath, redis
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version-file: node/go.mod
          cache-dependency-path: node/go.sum
      - name: Prepare Core
        working-directory: api
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          APP_ENV=testing php artisan key:generate
      - name: Actual native activation, identity, queue, render, traffic and settlement
        run: python3 scripts/verify-native-c2.py
