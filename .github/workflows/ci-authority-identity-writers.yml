name: authority-identity-writers

on:
  # Historical migration/prototype evidence; outside the native development gate.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authority-identity-writers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: txboard-ci-identity-root-only
          MYSQL_DATABASE: txboard_identity_fence_test
          MYSQL_USER: txboard_identity_fence
          MYSQL_PASSWORD: txboard-ci-identity-only
        ports: ['13306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ptxboard-ci-identity-root-only"
          --health-interval 5s --health-retries 20
    env:
      APP_ENV: testing
      AUTHORITY_IDENTITY_MYSQL: '1'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '13306'
      DB_DATABASE: txboard_identity_fence_test
      DB_USERNAME: txboard_identity_fence
      DB_PASSWORD: txboard-ci-identity-only
      CACHE_DRIVER: array
      SETTING_CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_DRIVER: array
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, pdo_sqlite, bcmath, pcntl, posix
          coverage: none
      - name: Restore locked Core dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Prepare disposable synthetic fixture
        run: |
          touch .env
          mkdir -p storage/framework/{cache/data,sessions,views} storage/logs bootstrap/cache
      - name: Native identity owners, compatibility, independent lock waits and crash recovery
        run: php artisan test --configuration phpunit-historical.xml --filter='AuthorityIdentityWritersTest|AuthorityIdentityConcurrencyTest|AuthorityIdentityEvidenceTest'
