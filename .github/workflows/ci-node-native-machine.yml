name: node-native-machine-control

# Historical legacy-model control proof; run only when explicitly requested.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-native-machine-control-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-machine-control:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: txboard-ci-native-machine-root-only
          MYSQL_DATABASE: txboard_native_machine_test
          MYSQL_USER: txboard_native_machine
          MYSQL_PASSWORD: txboard-ci-native-machine-only
        ports: ['13306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ptxboard-ci-native-machine-root-only"
          --health-interval 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['16379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-retries 20
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '13306'
      DB_DATABASE: txboard_native_machine_test
      DB_USERNAME: txboard_native_machine
      DB_PASSWORD: txboard-ci-native-machine-only
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '16379'
      REDIS_DB: '8'
      REDIS_CACHE_DB: '9'
      GOTOOLCHAIN: local
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, pdo_sqlite, bcmath, redis, pcntl, posix
          coverage: none
      - uses: actions/setup-go@v5
        with:
          go-version-file: node/go.mod
          cache-dependency-path: node/go.sum
      - name: Install local fixture prerequisites
        run: sudo apt-get update && sudo apt-get install -y mariadb-client openssl
      - name: Restore locked Core fixtures and Node dependencies
        run: |
          composer install --working-dir=api --no-interaction --prefer-dist
          cd node
          go mod download
      - name: Prepare disposable Core storage
        run: |
          touch api/.env
          mkdir -p api/storage/framework/{cache/data,sessions,views} api/storage/logs api/bootstrap/cache
      - name: True Core Workerman Machine control and durable replay
        run: python3 scripts/tests/node-native-machine/run.py "$PWD/api" "$PWD/node" "$RUNNER_TEMP/native-machine-evidence"
      - name: Preserve sanitized native Machine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-native-machine-control
          path: ${{ runner.temp }}/native-machine-evidence/result.json
          if-no-files-found: warn
          retention-days: 14
