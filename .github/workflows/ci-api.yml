name: api-ci

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "!api/**/*.md"
      - "contracts/core-api/**"
      - "scripts/generate-core-contracts.py"
      - "scripts/check-admin-unification.py"
      - "scripts/check-browser-core-surface.py"
      - "contracts/kernel/**"
      - "contracts/modules/**"
      - "contracts/releases/**"
      - "scripts/check-kernel-v1.py"
      - "scripts/check-modular-release.py"
      - "scripts/module-dev.py"
      - "scripts/renderer-dev.py"
      - "scripts/txboard-dev.py"
      - "scripts/tests/test_renderer_dev.py"
      - "scripts/tests/test_module_dev_integration.py"
      - "scripts/check-renderer-registry.py"
      - "contracts/renderers/**"
      - "node/internal/credentialdelivery/render*.go"
      - "node/internal/credentialprovider/render*.go"
      - "scripts/tests/test_module_dev.py"
      - "contracts/v2/**"
      - "contracts/module-package/**"
      - "contracts/module-lifecycle/**"
      - "contracts/theme-package/**"
      - "web/admin/src/api/**"
      - "scripts/fixtures/external-integration-routes.json"
      - "scripts/native-subscription-client.mjs"
      - "scripts/p0-api-audit.mjs"
      - "scripts/export-route-catalog.mjs"
      - "scripts/check-native-schema-only.mjs"
      - "scripts/tests/check-native-schema-only.test.mjs"
      - "scripts/tests/export-route-catalog.test.mjs"
      - "scripts/check-external-integration-routes.mjs"
      - "scripts/tests/check-external-integration-routes.test.mjs"
      - "scripts/tests/p0-api-audit.test.mjs"
      - "scripts/native-admin-release-audit.mjs"
      - "scripts/tests/native-admin-release-audit.test.mjs"
      - "scripts/check-core-boundaries.py"
      - "scripts/tests/test_check_core_boundaries.py"
      - ".github/workflows/ci-api.yml"
  pull_request:
    paths:
      - "api/**"
      - "!api/**/*.md"
      - "contracts/core-api/**"
      - "scripts/generate-core-contracts.py"
      - "scripts/check-admin-unification.py"
      - "scripts/check-browser-core-surface.py"
      - "contracts/kernel/**"
      - "contracts/modules/**"
      - "contracts/releases/**"
      - "scripts/check-kernel-v1.py"
      - "scripts/check-modular-release.py"
      - "scripts/module-dev.py"
      - "scripts/renderer-dev.py"
      - "scripts/txboard-dev.py"
      - "scripts/tests/test_renderer_dev.py"
      - "scripts/tests/test_module_dev_integration.py"
      - "scripts/check-renderer-registry.py"
      - "contracts/renderers/**"
      - "node/internal/credentialdelivery/render*.go"
      - "node/internal/credentialprovider/render*.go"
      - "scripts/tests/test_module_dev.py"
      - "contracts/v2/**"
      - "contracts/module-package/**"
      - "contracts/module-lifecycle/**"
      - "contracts/theme-package/**"
      - "web/admin/src/api/**"
      - "scripts/fixtures/external-integration-routes.json"
      - "scripts/native-subscription-client.mjs"
      - "scripts/p0-api-audit.mjs"
      - "scripts/export-route-catalog.mjs"
      - "scripts/check-native-schema-only.mjs"
      - "scripts/tests/check-native-schema-only.test.mjs"
      - "scripts/tests/export-route-catalog.test.mjs"
      - "scripts/check-external-integration-routes.mjs"
      - "scripts/tests/check-external-integration-routes.test.mjs"
      - "scripts/tests/p0-api-audit.test.mjs"
      - "scripts/native-admin-release-audit.mjs"
      - "scripts/tests/native-admin-release-audit.test.mjs"
      - "scripts/check-core-boundaries.py"
      - "scripts/tests/test_check_core_boundaries.py"
      - ".github/workflows/ci-api.yml"

  workflow_dispatch:

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CACHE_DRIVER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      SETTING_CACHE_STORE: array
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - name: Verify current Core domain boundaries
        working-directory: .
        run: |
          python3 scripts/generate-core-contracts.py --check
          python3 scripts/check-admin-unification.py
          python3 scripts/check-browser-core-surface.py
          python3 scripts/check-core-boundaries.py
          python3 scripts/check-kernel-v1.py
          python3 scripts/check-renderer-registry.py
          python3 scripts/check-modular-release.py
          python3 scripts/module-dev.py lock api/bootstrap/module-composition.json api/bootstrap/module-packages.lock.json --application-root api --check
          python3 scripts/module-dev.py lock api/bootstrap/module-composition.proof.json api/bootstrap/module-packages.proof.lock.json --application-root api --check
          python3 -m unittest discover -s scripts/tests -p test_check_core_boundaries.py
          python3 -m unittest discover -s scripts/tests -p test_module_dev.py
          python3 -m unittest discover -s scripts/tests -p test_renderer_dev.py
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, sqlite3, pdo_sqlite, curl, openssl, sodium, redis, bcmath, pcntl, posix, fileinfo
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Exercise the real module developer test runner
        working-directory: .
        run: python3 -m unittest discover -s scripts/tests -p test_module_dev_integration.py
      - name: Check PHP syntax
        run: find app config routes database tests plugins-core plugins/DeliveryReceipt plugins/OfferReservation plugins/ModulePortal -name '*.php' -print0 | xargs -0 -n1 php -l > "$RUNNER_TEMP/php-syntax.log"
      - name: Run current native development suite
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
        run: php artisan test
      - name: Actual durable HTTPS receiver restart after lost notification acknowledgement
        env:
          CORE_MODULE_RECEIVER_CERT: ${{ runner.temp }}/module-receiver.pem
          CORE_MODULE_RECEIVER_KEY: ${{ runner.temp }}/module-receiver.key
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=module-receiver-fixture -addext subjectAltName=IP:127.0.0.1 -keyout "$CORE_MODULE_RECEIVER_KEY" -out "$CORE_MODULE_RECEIVER_CERT" 2>/dev/null
          chmod 600 "$CORE_MODULE_RECEIVER_KEY"
          php artisan test tests/Integration/Modules/NotificationReceiverTest.php
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test native source and route audit tools
        working-directory: .
        run: |
          node --test scripts/tests/check-native-schema-only.test.mjs
          node --test scripts/tests/p0-api-audit.test.mjs
          node --test scripts/tests/native-admin-release-audit.test.mjs
          node --test scripts/tests/export-route-catalog.test.mjs
          node --test scripts/tests/check-external-integration-routes.test.mjs
      - name: Check native subscription consumer syntax
        working-directory: .
        run: node --check scripts/native-subscription-client.mjs
      - name: Verify native source and Admin references
        working-directory: .
        run: |
          node scripts/check-native-schema-only.mjs --check
          node scripts/native-admin-release-audit.mjs --strict --guard-native --output artifacts/release/admin-native-gap.json
      - name: Audit live HTTP routes and external integration contracts
        working-directory: .
        run: |
          php api/artisan route:list --json > "$RUNNER_TEMP/txboard-routes.json"
          node scripts/p0-api-audit.mjs --routes "$RUNNER_TEMP/txboard-routes.json" --output-dir artifacts/p0-audit
          node scripts/export-route-catalog.mjs --routes "$RUNNER_TEMP/txboard-routes.json" --json artifacts/route-catalog/http-routes.json --markdown artifacts/route-catalog/http-routes.md --check
          node scripts/check-external-integration-routes.mjs --routes "$RUNNER_TEMP/txboard-routes.json"
      - name: Preserve non-secret schema and route audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: txboard-api-contract-audit
          path: |
            artifacts/release/admin-native-gap.json
            artifacts/route-catalog/
            artifacts/p0-audit/
          if-no-files-found: warn
          retention-days: 14
