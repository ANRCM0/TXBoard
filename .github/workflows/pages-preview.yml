name: pages-preview

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Build previews
        env:
          VITE_STATIC_PREVIEW: "1"
        run: |
          VITE_BASE_PATH=/TXBoard/admin/ npm run build --workspace @txboard/admin
          VITE_BASE_PATH=/TXBoard/user/ npm run build --workspace @txboard/user
      - name: Assemble preview
        shell: bash
        run: |
          mkdir -p _site/admin _site/user
          cp -R web/admin/dist/. _site/admin/
          cp -R web/user/dist/. _site/user/
          touch _site/.nojekyll
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TXBoard Preview</title></head>
          <body><main><h1>TXBoard Preview</h1><p><a href="./admin/#/">Admin</a></p><p><a href="./user/#/dashboard">User</a></p></main></body></html>
          HTML
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
