<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Module portal</title><style>body{margin:0;padding:38px;background:#e7ede1;color:#183b38;font-family:Georgia,serif}small{font:12px monospace;letter-spacing:.15em}h1{font-size:40px;font-weight:400}button{background:#183b38;color:white;padding:12px 18px;border:0;font:14px monospace}pre{white-space:pre-wrap;font:14px monospace;line-height:1.8}</style>
<small>INDEPENDENT PRESENTATION</small><h1 id="label">Module portal</h1><p>This page uses the host Bridge and the module's declared operation.</p><button id="refresh">Read current status</button><pre id="result" role="status">Waiting for a host request.</pre>
<script>
const pending = new Set();
document.getElementById('refresh').addEventListener('click', () => {
  const id = crypto.randomUUID(); pending.add(id);
  parent.postMessage({channel:'core-module/v1',id,operation:'status.get',input:{}}, '*');
});
window.addEventListener('message', event => {
  if(event.source !== parent || event.data?.channel !== 'core-module/v1' || !pending.delete(event.data.id)) return;
  const data=event.data.data;
  document.getElementById('result').textContent=event.data.error || JSON.stringify(data,null,2);
  if(data?.label) document.getElementById('label').textContent=data.label;
});
</script></html>
